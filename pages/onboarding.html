<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 온보딩</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/button.css">
  <style>
    .onboarding-screen {
      background: white;
      display: flex;
      flex-direction: column;
    }

    .slides-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 120px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    }

    .slide.hidden-right { transform: translateX(100%); opacity: 0; }
    .slide.hidden-left  { transform: translateX(-100%); opacity: 0; }
    .slide.active       { transform: translateX(0); opacity: 1; }

    /* Slide 1 */
    .slide1-number {
      font-family: var(--font-mono);
      font-size: 160px;
      font-weight: 700;
      line-height: 1;
      color: var(--color-primary);
      letter-spacing: -0.05em;
      margin-bottom: 24px;
    }
    .slide-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin-bottom: 16px;
      text-align: center;
    }
    .slide-desc {
      font-size: 18px;
      color: var(--color-text-mid);
      text-align: center;
      line-height: 1.6;
    }

    /* Slide 2 */
    .slide2-icons {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }
    .slide2-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid;
    }
    .slide2-icon.center {
      width: 64px;
      height: 64px;
      border-radius: 24px;
      background: #EFF6FF;
      border-color: #BFDBFE;
    }
    .slide2-icon.left {
      background: var(--color-bg-subtle);
      border-color: var(--color-border);
    }
    .slide2-icon.right {
      background: #F0FDF4;
      border-color: #BBF7D0;
    }
    .slide2-connector {
      width: 24px;
      height: 2px;
      background: var(--color-border);
    }
    .slide2-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      color: var(--color-text-mid);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 32px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    /* Slide 3 */
    .slide3-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 56px;
    }
    .slide3-card {
      aspect-ratio: 1;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }
    .slide3-card.up {
      background: #F0FDF4;
      border-color: #BBF7D0;
    }
    .slide3-card.down {
      background: #FFF1F3;
      border-color: #FECDD3;
    }
    .slide3-card-label {
      font-size: 18px;
      font-weight: 700;
    }
    .slide3-card.up .slide3-card-label { color: #15803D; }
    .slide3-card.down .slide3-card-label { color: #BE123C; }

    /* Bottom controls */
    .onboarding-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(to top, white 80%, transparent);
      z-index: 10;
    }

    .dots {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
    }
    .dot {
      height: 8px;
      border-radius: 4px;
      background: var(--color-border);
      transition: all 0.3s;
    }
    .dot.active {
      width: 24px;
      background: var(--color-primary);
    }
    .dot:not(.active) { width: 8px; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen onboarding-screen">

    <div class="slides-wrapper" id="slides-wrapper">
      <!-- Slide 1 -->
      <div class="slide active" id="slide-0">
        <div class="slide1-number">10</div>
        <h2 class="slide-title">10일 연속 예측 성공</h2>
        <p class="slide-desc">매일 상승/하락을 맞히세요</p>
      </div>

      <!-- Slide 2 -->
      <div class="slide hidden-right" id="slide-1">
        <div class="slide2-icons">
          <div class="slide2-icon left">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </div>
          <div class="slide2-connector"></div>
          <div class="slide2-icon center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
          </div>
          <div class="slide2-connector"></div>
          <div class="slide2-icon right">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>
            </svg>
          </div>
        </div>
        <div class="slide2-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          리스크 0%
        </div>
        <h2 class="slide-title" style="font-size:22px;">광고 시청 → 예측 → <span style="color:var(--color-primary)">40만원</span></h2>
        <p class="slide-desc">잃을 게 없어요.<br>광고 15초만 보면 참여 가능</p>
      </div>

      <!-- Slide 3 -->
      <div class="slide hidden-right" id="slide-2">
        <div class="slide3-grid">
          <div class="slide3-card up">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
            </svg>
            <span class="slide3-card-label">상승</span>
          </div>
          <div class="slide3-card down">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>
            </svg>
            <span class="slide3-card-label">하락</span>
          </div>
        </div>
        <h2 class="slide-title">오늘 종가, 오를까요 내릴까요?</h2>
        <p class="slide-desc">매일 저녁 6시부터<br>다음날 오전 9시까지</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="onboarding-footer">
      <div class="dots">
        <div class="dot active" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
      </div>
      <button class="btn btn-full" id="next-btn" style="height:56px; font-size:16px;">
        다음
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

  </div>
</div>

<script>
  let current = 0;
  const total = 3;

  function goTo(index) {
    const prev = current;
    current = index;

    for (let i = 0; i < total; i++) {
      const el = document.getElementById(`slide-${i}`);
      const dot = document.getElementById(`dot-${i}`);
      if (i === current) {
        el.className = 'slide active';
        dot.classList.add('active');
      } else if (i < current) {
        el.className = 'slide hidden-left';
        dot.classList.remove('active');
      } else {
        el.className = 'slide hidden-right';
        dot.classList.remove('active');
      }
    }

    const btn = document.getElementById('next-btn');
    if (current === total - 1) {
      btn.className = 'btn btn-primary btn-full';
      btn.innerHTML = '시작하기';
    } else {
      btn.className = 'btn btn-secondary btn-full';
      btn.innerHTML = '다음 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
    }
  }

  document.getElementById('next-btn').addEventListener('click', () => {
    if (current < total - 1) goTo(current + 1);
    else location.href = './login.html';
  });

  // Touch swipe
  let touchStartX = 0;
  document.getElementById('slides-wrapper').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('slides-wrapper').addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (diff > 50 && current < total - 1) goTo(current + 1);
    if (diff < -50 && current > 0) goTo(current - 1);
  }, { passive: true });

  // Init
  goTo(0);
</script>
</body>
</html>
