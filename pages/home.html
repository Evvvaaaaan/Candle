<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 홈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/bottom-nav.css">
  <link rel="stylesheet" href="../src/css/components/button.css">
  <style>
    /* ── Streak Visualization ── */
    .streak-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 0 0;
      background: white;
    }

    .streak-number {
      font-family: var(--font-mono);
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--color-text-dark);
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .streak-number.streak-high { color: var(--color-primary); }

    .streak-label {
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text-mid);
      margin-bottom: 40px;
    }

    /* Progress bar */
    .streak-progress-wrap {
      width: 100%;
      max-width: 343px;
      padding: 0 24px;
      margin-bottom: 40px;
    }

    .streak-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--color-border);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--color-primary), var(--color-success));
      border-radius: 9999px;
      transition: width 0.8s ease-out;
    }

    /* Calendar strip */
    .streak-calendar {
      width: 100%;
      overflow-x: auto;
      padding: 24px 16px 16px;
    }
    .streak-calendar::-webkit-scrollbar { display: none; }
    .streak-calendar { -ms-overflow-style: none; scrollbar-width: none; }

    .calendar-inner {
      display: flex;
      width: max-content;
      position: relative;
    }

    .cal-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 36px;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .cal-day:last-child { margin-right: 0; }

    .cal-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--color-border);
      background: white;
    }

    .cal-circle.success {
      background: var(--color-success);
      border-color: var(--color-success);
    }

    .cal-circle.fail {
      background: var(--color-danger);
      border-color: var(--color-danger);
    }

    .cal-circle.pending {
      border: 2px dashed var(--color-primary);
      background: white;
      animation: pulseBorder 2s ease-in-out infinite;
    }

    @keyframes pulseBorder {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .cal-date {
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--color-text-mid);
      margin-top: 8px;
      letter-spacing: -0.05em;
    }

    .cal-date.today { color: var(--color-primary); }

    /* Prediction status card */
    .prediction-card {
      margin: 8px 16px 24px;
      background: var(--color-bg-subtle);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .prediction-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px dashed var(--color-primary);
      border-radius: 16px;
      animation: pulseBorder 2s ease-in-out infinite;
      pointer-events: none;
    }

    .prediction-card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .timer-label {
      font-size: 12px;
      color: var(--color-text-mid);
      margin-bottom: 4px;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen">

    <!-- Header -->
    <header class="page-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="26" y="16" width="8" height="28" rx="2" fill="#2563EB"/>
          <line x1="30" y1="8" x2="30" y2="16" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="44" x2="30" y2="52" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <rect x="12" y="28" width="8" height="16" rx="2" fill="#2563EB" opacity="0.6"/>
          <line x1="16" y1="22" x2="16" y2="28" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <line x1="16" y1="44" x2="16" y2="48" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <rect x="40" y="20" width="8" height="20" rx="2" fill="#2563EB" opacity="0.8"/>
          <line x1="44" y1="12" x2="44" y2="20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <line x1="44" y1="40" x2="44" y2="46" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </svg>
        <span class="header-logo-text">Candle</span>
      </div>
      <button style="position:relative;color:var(--color-text-mid);" onclick="location.href='./notification-settings.html'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <div style="position:absolute;top:4px;right:4px;width:8px;height:8px;background:#EF4444;border-radius:50%;border:2px solid white;"></div>
      </button>
    </header>

    <!-- Scrollable content -->
    <div class="scroll-area" style="background:white;">

      <!-- Streak Visualization -->
      <div class="streak-section">
        <div class="streak-number" id="streak-num">0</div>
        <p class="streak-label">연속 예측 성공</p>

        <!-- Progress -->
        <div class="streak-progress-wrap">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
          </div>
        </div>

        <!-- Calendar -->
        <div class="streak-calendar">
          <div class="calendar-inner" id="calendar"></div>
        </div>
      </div>

      <!-- Prediction card -->
      <div class="prediction-card" id="prediction-card">
        <h3 class="prediction-card-title">오늘의 예측 미완료</h3>
        <span class="timer-label">마감까지</span>
        <span class="timer-display" id="timer">02:14:49</span>
        <button class="btn btn-primary btn-full" style="position:relative;overflow:hidden;" onclick="location.href='./ad-watch.html'">
          <div style="position:absolute;inset:0;background:rgba(255,255,255,0.15);animation:pulseBorder 2s ease-in-out infinite;"></div>
          <span style="position:relative;z-index:1;">광고 보고 예측하기</span>
        </button>
      </div>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="bottom-nav"></nav>

  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script src="../src/js/utils/router.js"></script>
<script src="../src/js/utils/format.js"></script>
<script src="../src/js/components/bottom-nav.js"></script>
<script>
  renderBottomNav('home');

  // Streak data (mock)
  const STREAK = 7;

  // Count-up animation
  function countUp(el, target, duration = 800) {
    const start = performance.now();
    const animate = (now) => {
      const progress = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 4);
      el.textContent = Math.round(target * ease);
      if (progress < 1) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }

  // Progress bar
  function updateProgress(streak) {
    const pct = Math.min((streak / 10) * 100, 100);
    document.getElementById('progress-fill').style.width = `${pct}%`;
  }

  // Calendar
  function buildCalendar(streak) {
    const container = document.getElementById('calendar');
    const today = new Date();
    const days = [];

    for (let i = 9; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      let state = 'future';
      const daysAgo = i;
      if (daysAgo > 0 && daysAgo <= streak) state = 'success';
      else if (daysAgo === 0) state = 'pending';
      days.push({ date: dateStr, state, isToday: daysAgo === 0 });
    }

    container.innerHTML = days.map(d => `
      <div class="cal-day">
        <div class="cal-circle ${d.state}">
          ${d.state === 'success' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          ${d.state === 'fail' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>' : ''}
        </div>
        <span class="cal-date ${d.isToday ? 'today' : ''}">${d.isToday ? '오늘' : d.date}</span>
      </div>
    `).join('');
  }

  // Timer countdown
  function startTimer() {
    const el = document.getElementById('timer');
    let [h, m, s] = el.textContent.split(':').map(Number);
    setInterval(() => {
      if (s > 0) s--;
      else { s = 59; if (m > 0) m--; else { m = 59; if (h > 0) h--; } }
      el.textContent = [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }, 1000);
  }

  // Streak number color
  const streakEl = document.getElementById('streak-num');
  if (STREAK >= 3) streakEl.classList.add('streak-high');

  // Initialize
  setTimeout(() => {
    countUp(streakEl, STREAK);
    updateProgress(STREAK);
    buildCalendar(STREAK);
    startTimer();
  }, 100);
</script>
</body>
</html>
