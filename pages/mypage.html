<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 마이페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/bottom-nav.css">
  <style>
    .profile-card {
      margin: 24px 16px 16px;
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--color-primary);
      border: 2px solid var(--color-primary-light);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    .profile-name { margin-top: 12px; font-size: 18px; font-weight: 600; color: var(--color-text-dark); }
    .profile-date { margin-top: 4px; font-size: 12px; color: var(--color-text-mid); }
    .profile-divider { width: 100%; height: 1px; background: var(--color-border-mid); margin: 16px 0; }

    .stats-row { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 8px; }
    .stat-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .stat-value { font-family: var(--font-mono); font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--color-text-mid); }
    .stat-divider { width: 1px; height: 32px; background: var(--color-border); }

    .stats-detail-card {
      margin: 0 16px 16px;
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 20px;
    }

    .detail-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 44px; border-bottom: 1px solid var(--color-border-mid);
    }
    .detail-row:last-child { border-bottom: none; }

    .menu-btn {
      width: 100%; height: 56px;
      border-radius: 12px;
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
      transition: background-color 0.15s;
      cursor: pointer;
    }
    .menu-btn:last-child { margin-bottom: 0; }
    .menu-btn-inner { display: flex; align-items: center; gap: 12px; }
    .menu-btn-label { font-size: 14px; font-weight: 500; color: var(--color-text-dark); }
    .menu-btn-label.danger { color: var(--color-danger-alt); }

    .menu-btn.highlight { background: var(--color-primary-light); }
    .menu-btn.highlight:hover { background: #D1E9FF; }
    .menu-btn.normal { background: white; border: 1px solid var(--color-border); }
    .menu-btn.normal:hover { background: var(--color-bg-slate); }
    .menu-btn.danger-btn { background: white; border: 1px solid var(--color-border); }
    .menu-btn.danger-btn:hover { background: #FEF2F2; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:var(--color-bg-subtle);">

    <header class="page-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 60 60" fill="none">
          <rect x="26" y="16" width="8" height="28" rx="2" fill="#2563EB"/>
          <line x1="30" y1="8" x2="30" y2="16" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="44" x2="30" y2="52" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <rect x="12" y="28" width="8" height="16" rx="2" fill="#2563EB" opacity="0.6"/>
          <line x1="16" y1="44" x2="16" y2="48" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <rect x="40" y="20" width="8" height="20" rx="2" fill="#2563EB" opacity="0.8"/>
          <line x1="44" y1="12" x2="44" y2="20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <line x1="44" y1="40" x2="44" y2="46" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </svg>
        <span class="header-logo-text">Candle</span>
      </div>
      <div style="width:28px;height:28px;"></div>
    </header>

    <div class="scroll-area" style="padding-bottom:40px;">

      <!-- Profile card -->
      <div class="profile-card">
        <div class="avatar">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="profile-name" id="profile-name">-</div>
        <div class="profile-date" id="profile-date">가입 일자: -</div>
        <div class="profile-divider"></div>
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-value" id="stat-streak" style="color:var(--color-primary);">-</span>
            <span class="stat-label">현재 연승</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" id="stat-best-streak" style="color:var(--color-success);">-</span>
            <span class="stat-label">최고 연승</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-value" id="stat-accuracy" style="color:#F59E0B;">-%</span>
            <span class="stat-label">정확도</span>
          </div>
        </div>
      </div>

      <!-- Stats detail -->
      <div class="stats-detail-card">
        <h3 style="font-size:16px;font-weight:600;color:var(--color-text-dark);margin-bottom:12px;">나의 예측 통계</h3>
        <div class="detail-row">
          <span style="font-size:13px;color:var(--color-text-mid);">총 예측 횟수</span>
          <span id="stat-total" style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--color-text-dark);">-회</span>
        </div>
        <div class="detail-row">
          <span style="font-size:13px;color:var(--color-text-mid);">맞춘 횟수</span>
          <span id="stat-correct" style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--color-success);">-회</span>
        </div>
      </div>

      <!-- Menu buttons -->
      <div style="margin:0 16px;">
        <button class="menu-btn highlight" onclick="location.href='./reward-claim.html'">
          <div class="menu-btn-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            <span class="menu-btn-label">보상신청 바로가기</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="menu-btn normal" onclick="location.href='./notification-settings.html'">
          <div class="menu-btn-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="menu-btn-label">알림설정</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="menu-btn normal" onclick="location.href='./settings.html'">
          <div class="menu-btn-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="menu-btn-label">앱 설정</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="menu-btn danger-btn" onclick="if(confirm('로그아웃 하시겠어요?')) location.href='./login.html'">
          <div class="menu-btn-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="menu-btn-label danger">로그아웃</span>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script src="../src/js/utils/router.js"></script>
<script src="../src/js/services/api.js"></script>
<script src="../src/js/services/user.service.js"></script>
<script src="../src/js/components/bottom-nav.js"></script>
<script>
  renderBottomNav('mypage');

  async function init() {
    const user = await UserService.getProfile();
    document.getElementById('profile-name').textContent = user.nickname;
    document.getElementById('profile-date').textContent = `가입 일자: ${user.joinDate}`;
    document.getElementById('stat-streak').textContent = user.streak;
    document.getElementById('stat-best-streak').textContent = user.bestStreak;
    document.getElementById('stat-accuracy').textContent = user.accuracy + '%';
    document.getElementById('stat-total').textContent = user.totalPredictions + '회';
    document.getElementById('stat-correct').textContent = user.correctPredictions + '회';
  }

  init();
</script>
</body>
</html>
