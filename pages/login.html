<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <style>
    .login-screen { overflow: hidden; }

    .login-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .login-bg-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 0;
      overflow: hidden;
    }

    .login-logo-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-80px);
    }

    .login-title {
      font-size: 40px;
      font-weight: 700;
      color: var(--color-text-dark);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-top: -60px;
      margin-bottom: 12px;
    }

    .login-subtitle {
      font-size: 16px;
      color: var(--color-text-mid);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .login-footer {
      padding: 0 20px 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 10;
      background: linear-gradient(to top, white, white 80%, transparent);
      padding-top: 40px;
    }

    .btn-kakao-custom {
      width: 100%;
      height: 56px;
      background: #FEE500;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(0,0,0,0.9);
      position: relative;
      box-shadow: 0 4px 12px rgba(254,229,0,0.2);
      transition: background-color 0.15s;
      cursor: pointer;
      border: none;
    }

    .btn-kakao-custom:hover { background: #FDD800; }

    .btn-kakao-icon {
      position: absolute;
      left: 20px;
    }

    .login-legal {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .login-legal p {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 500;
      text-align: center;
    }

    .login-legal-links {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: #94A3B8;
    }

    .login-legal-links button {
      font-size: 12px;
      color: #94A3B8;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .login-legal-links button:hover { color: var(--color-text-mid); }

    .legal-divider {
      color: #E2E8F0;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen login-screen">

    <div class="login-content">
      <!-- Background chart SVG -->
      <div class="login-bg-svg">
        <svg viewBox="0 0 375 400" style="width:100%;height:400px;margin-bottom:-118px;" fill="none" preserveAspectRatio="none">
          <path d="M-20,320 C80,320 120,120 187.5,180 C255,240 280,100 400,80 L400,400 L-20,400 Z" fill="url(#fill_grad)"/>
          <path d="M-20,320 C80,320 120,120 187.5,180 C255,240 280,100 400,80" stroke="url(#line_grad)" stroke-width="3" stroke-linecap="round"/>
          <path d="M-20,340 C80,340 120,140 187.5,200 C255,260 280,120 400,100" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.1"/>
          <defs>
            <linearGradient id="line_grad" x1="0" y1="320" x2="375" y2="80" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2563EB" stop-opacity="0.2"/>
              <stop offset="0.5" stop-color="#2563EB"/>
              <stop offset="1" stop-color="#00C896"/>
            </linearGradient>
            <linearGradient id="fill_grad" x1="187.5" y1="80" x2="187.5" y2="400" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2563EB" stop-opacity="0.15"/>
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Logo + Title -->
      <div class="login-logo-wrap">
        <svg width="52" height="52" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:4px;">
          <rect x="26" y="16" width="8" height="28" rx="2" fill="#2563EB"/>
          <line x1="30" y1="8" x2="30" y2="16" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="44" x2="30" y2="52" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <rect x="12" y="28" width="8" height="16" rx="2" fill="#2563EB" opacity="0.6"/>
          <line x1="16" y1="22" x2="16" y2="28" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <line x1="16" y1="44" x2="16" y2="48" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <rect x="40" y="20" width="8" height="20" rx="2" fill="#2563EB" opacity="0.8"/>
          <line x1="44" y1="12" x2="44" y2="20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <line x1="44" y1="40" x2="44" y2="46" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </svg>
        <h1 class="login-title">Candle</h1>
        <p class="login-subtitle">내 예측이 곧 수익이 되는 공간</p>
      </div>
    </div>

    <!-- Bottom section -->
    <div class="login-footer">
      <button class="btn-kakao-custom" id="kakao-btn">
        <span class="btn-kakao-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 2.5C5.85786 2.5 2.5 5.25329 2.5 8.65C2.5 10.8354 3.93175 12.7533 5.96205 13.8443L5.20173 16.5912C5.1257 16.8658 5.43431 17.0664 5.66579 16.9149L8.93247 14.7735C9.28014 14.819 9.63607 14.8436 10 14.8436C14.1421 14.8436 17.5 12.0903 17.5 8.69355C17.5 5.29681 14.1421 2.54352 10 2.54352Z" fill="#000000"/>
          </svg>
        </span>
        카카오로 시작하기
      </button>

      <div class="login-legal">
        <p>서비스 이용을 위해 본인인증이 필요합니다</p>
        <div class="login-legal-links">
          <button>이용약관</button>
          <span class="legal-divider">|</span>
          <button>개인정보처리방침</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  document.getElementById('kakao-btn').addEventListener('click', () => {
    // 실제 Kakao SDK 연동 시 여기서 Kakao.Auth.login() 호출
    // 현재는 nickname 페이지로 바로 이동
    location.href = './nickname.html';
  });
</script>
</body>
</html>
