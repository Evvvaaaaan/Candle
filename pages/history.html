<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 예측 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/bottom-nav.css">
</head>
<body>
<div class="app-wrapper">
  <div class="screen">
    <header class="page-header">
      <button class="header-back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title">예측 기록</h1>
      <div style="width:40px;"></div>
    </header>

    <div class="scroll-area" style="background:var(--color-bg-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:80px;">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--color-border);display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:24px;">📊</div>
      <h2 style="font-size:16px;font-weight:600;color:var(--color-text-dark);margin-bottom:8px;">기록이 아직 없습니다</h2>
      <p style="font-size:13px;color:var(--color-text-mid);">오늘의 예측을 완료하고 기록을 쌓아보세요.</p>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<script src="../src/js/utils/router.js"></script>
<script src="../src/js/components/bottom-nav.js"></script>
<script>renderBottomNav('');</script>
</body>
</html>
