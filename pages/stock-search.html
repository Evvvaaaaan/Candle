<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 종목 선택</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/bottom-nav.css">
  <style>
    .search-bar-wrap {
      padding: 16px;
      background: white;
      border-bottom: 1px solid var(--color-border);
    }
    .search-bar {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-mid);
    }
    .search-input {
      width: 100%;
      height: 48px;
      padding: 0 48px;
      background: var(--color-bg-subtle);
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--color-text-dark);
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--color-text-light); }
    .search-input:focus { border-color: var(--color-primary); }
    .search-clear {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-light);
      display: none;
    }
    .search-clear.visible { display: flex; }

    .stock-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stock-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      cursor: pointer;
      transition: background-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stock-card:hover { background: var(--color-bg-subtle); }
    .stock-card:active { transform: scale(0.98); }

    .stock-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-dark);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .stock-code {
      font-size: 12px;
      color: var(--color-text-mid);
      font-family: var(--font-mono);
    }
    .stock-price {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-dark);
      font-family: var(--font-mono);
      margin-bottom: 4px;
      text-align: right;
    }
    .stock-change {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-mono);
    }

    .stock-skeleton {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    .skeleton-line {
      background: var(--color-border);
      border-radius: 4px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .info-banner {
      margin: 0 16px 16px;
      padding: 16px;
      background: var(--color-primary-light);
      border: 1px solid var(--color-primary);
      border-radius: 12px;
      font-size: 13px;
      color: var(--color-text-dark);
      line-height: 1.6;
      display: none;
    }
    .info-banner.visible { display: block; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      display: none;
    }
    .empty-state.visible { display: flex; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:white;">

    <!-- Header -->
    <header class="page-header">
      <div class="header-logo">
        <svg width="28" height="28" viewBox="0 0 60 60" fill="none">
          <rect x="26" y="16" width="8" height="28" rx="2" fill="#2563EB"/>
          <line x1="30" y1="8" x2="30" y2="16" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <line x1="30" y1="44" x2="30" y2="52" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
          <rect x="12" y="28" width="8" height="16" rx="2" fill="#2563EB" opacity="0.6"/>
          <line x1="16" y1="22" x2="16" y2="28" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <line x1="16" y1="44" x2="16" y2="48" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
          <rect x="40" y="20" width="8" height="20" rx="2" fill="#2563EB" opacity="0.8"/>
          <line x1="44" y1="12" x2="44" y2="20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <line x1="44" y1="40" x2="44" y2="46" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </svg>
        <span class="header-logo-text">종목 선택</span>
      </div>
    </header>

    <!-- Search -->
    <div class="search-bar-wrap">
      <div class="search-bar">
        <span class="search-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="search-input" class="search-input" placeholder="종목명 또는 종목코드 검색">
        <button class="search-clear" id="search-clear">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- List -->
    <div class="scroll-area" id="scroll-area" style="background:var(--color-bg-app);">
      <!-- Info banner -->
      <div class="info-banner" id="info-banner">
        <span style="font-weight:600;">💡 시가총액 상위 20개</span> 종목을 보여드리고 있어요. 원하는 종목이 없다면 검색해보세요!
      </div>

      <!-- Skeleton -->
      <div class="stock-list" id="skeleton-list">
        ${Array.from({length:6}).map(() => `
          <div class="stock-skeleton">
            <div style="display:flex;justify-content:space-between;">
              <div>
                <div class="skeleton-line" style="width:96px;height:18px;margin-bottom:8px;"></div>
                <div class="skeleton-line" style="width:64px;height:12px;background:var(--color-bg-slate);"></div>
              </div>
              <div>
                <div class="skeleton-line" style="width:80px;height:20px;margin-bottom:8px;margin-left:auto;"></div>
                <div class="skeleton-line" style="width:64px;height:14px;margin-left:auto;background:var(--color-bg-slate);"></div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>

      <!-- Actual list -->
      <div class="stock-list" id="stock-list" style="display:none;"></div>

      <!-- Empty state -->
      <div class="empty-state" id="empty-state">
        <div style="width:64px;height:64px;background:var(--color-bg-subtle);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <p style="font-size:16px;font-weight:600;color:var(--color-text-dark);margin-bottom:4px;">검색 결과가 없습니다</p>
        <p style="font-size:13px;color:var(--color-text-mid);">다른 종목명이나 코드로 검색해보세요</p>
      </div>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script src="../src/js/utils/router.js"></script>
<script src="../src/js/utils/format.js"></script>
<script src="../src/js/services/api.js"></script>
<script src="../src/js/services/stock.service.js"></script>
<script src="../src/js/components/bottom-nav.js"></script>
<script>
  renderBottomNav('');

  let allStocks = [];
  let searchTimer = null;

  const STOCKS_STATIC = [
    { code: '005930', name: '삼성전자' },
    { code: '000660', name: 'SK하이닉스' },
    { code: '373220', name: 'LG에너지솔루션' },
    { code: '207940', name: '삼성바이오로직스' },
    { code: '005490', name: 'POSCO홀딩스' },
    { code: '035420', name: 'NAVER' },
    { code: '005380', name: '현대차' },
    { code: '006400', name: '삼성SDI' },
    { code: '051910', name: 'LG화학' },
    { code: '035720', name: '카카오' },
    { code: '068270', name: '셀트리온' },
    { code: '028260', name: '삼성물산' },
    { code: '105560', name: 'KB금융' },
    { code: '055550', name: '신한지주' },
    { code: '096770', name: 'SK이노베이션' },
    { code: '003670', name: '포스코퓨처엠' },
    { code: '012330', name: '현대모비스' },
    { code: '066570', name: 'LG전자' },
    { code: '086790', name: '하나금융지주' },
    { code: '033780', name: 'KT&G' },
  ];

  function renderStocks(stocks) {
    const list = document.getElementById('stock-list');
    const empty = document.getElementById('empty-state');
    const banner = document.getElementById('info-banner');

    if (stocks.length === 0) {
      list.style.display = 'none';
      empty.classList.add('visible');
      banner.classList.remove('visible');
      return;
    }

    empty.classList.remove('visible');
    const query = document.getElementById('search-input').value.trim();
    if (!query) banner.classList.add('visible');
    else banner.classList.remove('visible');

    list.style.display = 'flex';
    list.innerHTML = stocks.map(s => {
      const isUp = (s.changeRate ?? 0) >= 0;
      const color = isUp ? 'var(--color-success)' : 'var(--color-danger)';
      const sign = isUp ? '+' : '';
      const arrow = isUp
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>';

      return `
        <div class="stock-card" onclick="selectStock(${JSON.stringify(s).replace(/"/g, '&quot;')})">
          <div>
            <div class="stock-name">${s.name}</div>
            <div class="stock-code">${s.code}</div>
          </div>
          <div>
            ${s.currentPrice != null ? `
              <div class="stock-price">${s.currentPrice.toLocaleString()}원</div>
              <div class="stock-change" style="color:${color}">
                ${arrow}
                ${sign}${s.changeRate?.toFixed(2)}%
              </div>
            ` : `
              <div style="width:80px;height:20px;background:var(--color-border);border-radius:4px;margin-bottom:8px;animation:pulse 1.5s infinite;"></div>
              <div style="width:64px;height:14px;background:var(--color-bg-slate);border-radius:4px;animation:pulse 1.5s infinite;"></div>
            `}
          </div>
        </div>
      `;
    }).join('');
  }

  function selectStock(stock) {
    if (!stock.currentPrice) return;
    sessionStorage.setItem('routeParams', JSON.stringify({
      ticker: stock.code,
      stockName: stock.name,
      currentPrice: stock.currentPrice,
      changeRate: stock.changeRate,
    }));
    location.href = './prediction.html';
  }

  async function loadPrices() {
    await new Promise(r => setTimeout(r, 800));
    allStocks = STOCKS_STATIC.map(s => ({
      ...s,
      currentPrice: Math.floor(Math.random() * 100000) + 10000,
      changeRate: (Math.random() - 0.5) * 10,
    }));
    document.getElementById('skeleton-list').style.display = 'none';
    renderStocks(allStocks);
  }

  // Search
  document.getElementById('search-input').addEventListener('input', (e) => {
    const val = e.target.value.trim();
    const clearBtn = document.getElementById('search-clear');
    clearBtn.classList.toggle('visible', val.length > 0);

    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (!val) { renderStocks(allStocks); return; }
      const lower = val.toLowerCase();
      const filtered = allStocks.filter(s =>
        s.name.toLowerCase().includes(lower) || s.code.includes(val)
      );
      renderStocks(filtered);
    }, 300);
  });

  document.getElementById('search-clear').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('visible');
    renderStocks(allStocks);
  });

  loadPrices();
</script>
</body>
</html>
