<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 광고 시청</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/button.css">
  <style>
    .step { position: absolute; inset: 0; display: flex; flex-direction: column; transition: opacity 0.3s; }
    .step.hidden { opacity: 0; pointer-events: none; }

    /* Before */
    .before-header { display: flex; align-items: center; padding: 16px 20px; }
    .before-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 32px 24px 0; }
    .lock-icon { width: 80px; height: 80px; border-radius: 50%; background: #EFF6FF; border: 1px solid #BFDBFE; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(15,23,42,0.06); margin-bottom: 24px; }
    .before-title { font-size: 24px; font-weight: 700; color: var(--color-text-dark); text-align: center; margin-bottom: 12px; }
    .before-desc { font-size: 15px; color: var(--color-text-mid); text-align: center; line-height: 1.6; margin-bottom: 32px; }
    .ad-preview { width: 100%; aspect-ratio: 4/3; background: var(--color-bg-subtle); border-radius: 16px; border: 1px solid var(--color-border); display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 32px; box-shadow: 0 1px 4px rgba(15,23,42,0.04); overflow: hidden; position: relative; }
    .shimmer { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: translateX(-100%); animation: shimmer 2s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .before-footer { width: 100%; margin-top: auto; padding-bottom: 48px; display: flex; flex-direction: column; align-items: center; }
    .ticket-info { font-size: 12px; color: var(--color-text-mid); margin-top: 16px; }
    .ticket-count { font-family: var(--font-mono); color: var(--color-primary); font-weight: 600; margin-left: 4px; }

    /* Watching */
    .watching-step { background: #1E293B; }
    .ad-area { position: absolute; inset: 0; background: #1E293B; display: flex; align-items: center; justify-content: center; }
    .ad-text { font-size: 24px; font-weight: 700; color: #475569; letter-spacing: 0.2em; user-select: none; }
    .timer-overlay { position: absolute; top: 48px; right: 24px; display: flex; align-items: center; gap: 12px; }
    .timer-badge { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 500; color: white; border: 1px solid rgba(255,255,255,0.1); }
    .timer-circle-wrap { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
    .timer-circle-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-count { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: white; }
    .skip-badge { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 9999px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
    .skip-badge span { font-size: 12px; font-weight: 500; color: #CBD5E1; }

    /* Success */
    .success-step { background: rgba(255,255,255,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); z-index: 50; }
    .success-icon-wrap { width: 96px; height: 96px; border-radius: 50%; background: #EFF6FF; border: 1px solid #BFDBFE; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(15,23,42,0.06); margin-bottom: 24px; }
    .success-title { font-size: 24px; font-weight: 700; color: var(--color-text-dark); }

    /* Back btn */
    .back-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-left: -8px; border-radius: 50%; color: var(--color-text-mid); }
    .back-btn:hover { background: var(--color-bg-subtle); }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen">

    <!-- Step 1: Before -->
    <div class="step" id="step-before">
      <div class="before-header">
        <button class="back-btn" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>
      <div class="before-content">
        <div class="lock-icon">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h2 class="before-title">예측에 참여하려면</h2>
        <p class="before-desc">15초 광고를 시청하면<br>오늘의 예측권이 생겨요</p>
        <div class="ad-preview">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" style="margin-bottom:12px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span style="color:var(--color-text-light);font-weight:500;">광고 로딩 중</span>
          <div class="shimmer"></div>
        </div>
        <div class="before-footer">
          <button class="btn btn-primary btn-full" onclick="startAd()">
            광고 보고 예측하기 →
          </button>
          <p class="ticket-info">오늘의 예측권 <span class="ticket-count">0/1</span></p>
        </div>
      </div>
    </div>

    <!-- Step 2: Watching -->
    <div class="step hidden" id="step-watching" style="background:#1E293B;">
      <div class="ad-area">
        <p class="ad-text">ADVERTISEMENT</p>
      </div>
      <div class="timer-overlay">
        <span class="timer-badge">리워드까지</span>
        <div class="timer-circle-wrap">
          <svg class="timer-circle-svg" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
            <circle cx="20" cy="20" r="16" fill="none" stroke="#2563EB" stroke-width="3"
                    stroke-dasharray="100.53"
                    stroke-dashoffset="0"
                    stroke-linecap="round"
                    id="timer-ring"/>
          </svg>
          <span class="timer-count" id="timer-count">15</span>
        </div>
      </div>
      <div class="skip-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>광고를 건너뛸 수 없습니다</span>
      </div>
    </div>

    <!-- Step 3: Success -->
    <div class="step hidden" id="step-success" style="background:rgba(255,255,255,0.97);z-index:50;">
      <div class="success-icon-wrap">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="lock-icon">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <span class="success-title" id="success-title"></span>
    </div>

  </div>
</div>

<script>
  let adTimer = null;
  const CIRCUMFERENCE = 2 * Math.PI * 16; // ~100.53

  function startAd() {
    document.getElementById('step-before').classList.add('hidden');
    document.getElementById('step-watching').classList.remove('hidden');

    let timeLeft = 15;
    const ring = document.getElementById('timer-ring');
    const count = document.getElementById('timer-count');

    adTimer = setInterval(() => {
      timeLeft--;
      count.textContent = timeLeft;
      ring.setAttribute('stroke-dashoffset', CIRCUMFERENCE * (1 - timeLeft / 15));

      if (timeLeft <= 0) {
        clearInterval(adTimer);
        showSuccess();
      }
    }, 1000);
  }

  function showSuccess() {
    document.getElementById('step-watching').classList.add('hidden');
    const successStep = document.getElementById('step-success');
    successStep.style.display = 'flex';
    successStep.style.flexDirection = 'column';
    successStep.style.alignItems = 'center';
    successStep.style.justifyContent = 'center';
    successStep.classList.remove('hidden');

    setTimeout(() => {
      document.getElementById('lock-icon').innerHTML = `
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a4 4 0 0 1 7.5-1"/>
      `;
      document.getElementById('success-title').textContent = '예측권 획득!';
    }, 300);

    setTimeout(() => {
      location.href = './stock-search.html';
    }, 1100);
  }
</script>
</body>
</html>
