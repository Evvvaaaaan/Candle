<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 랭킹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/bottom-nav.css">
  <style>
    .tab-bar {
      height: 48px;
      display: flex;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
      background: white;
      z-index: 20;
    }

    .tab-btn {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-mid);
      transition: color 0.15s;
    }

    .tab-btn.active { color: var(--color-primary); }

    .tab-indicator {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-primary);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.25s;
    }

    .tab-btn.active .tab-indicator { transform: scaleX(1); }

    /* Sticky my rank bar */
    .my-rank-bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--color-primary-light);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #BFDBFE;
      box-shadow: 0 2px 10px rgba(37,99,235,0.05);
    }

    .my-rank-left { display: flex; align-items: center; gap: 10px; }
    .my-rank-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--color-text-light); }
    .my-rank-name { font-size: 15px; font-weight: 600; color: var(--color-text-dark); }
    .my-rank-streak { font-size: 15px; font-weight: 700; font-family: var(--font-mono); color: var(--color-primary); letter-spacing: -0.02em; }

    .my-rank-right { display: flex; align-items: center; gap: 8px; }
    .my-rank-position { font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: var(--color-text-dark); letter-spacing: -0.02em; }
    .rank-change { display: flex; align-items: center; }
    .rank-change-num { font-size: 12px; font-family: var(--font-mono); font-weight: 700; margin-left: 2px; }

    /* Top 3 */
    .rank-1-row {
      background: var(--color-bg-subtle);
      border-bottom: 1px solid var(--color-border);
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .rank-top-bg {
      position: absolute;
      right: -20px;
      top: -20px;
      color: var(--color-primary);
      opacity: 0.03;
    }

    .rank-avatar {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-row {
      border-bottom: 1px solid var(--color-border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .rank-row:hover { background: var(--color-bg-subtle); }
    .rank-row.mine { background: var(--color-bg-subtle); }

    .rank-num { font-family: var(--font-mono); font-weight: 600; width: 32px; text-align: center; }
    .rank-user-name { font-size: 15px; font-weight: 500; color: var(--color-text-dark); }
    .rank-value { font-family: var(--font-mono); font-weight: 600; font-size: 18px; color: var(--color-text-dark); letter-spacing: -0.02em; }
    .rank-unit { font-size: 12px; font-weight: 500; color: var(--color-text-mid); font-family: var(--font-ui); }

    .update-note {
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .note-badge {
      font-size: 13px;
      color: var(--color-text-mid);
      background: var(--color-bg-slate);
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 500;
    }

    /* Quarter banner */
    .quarter-banner {
      background: var(--color-bg-subtle);
      border-bottom: 1px solid var(--color-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:white;">

    <!-- Header -->
    <header class="page-header">
      <button class="header-back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title">랭킹</h1>
      <div style="width:40px;"></div>
    </header>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-streak" onclick="switchTab('streak')">
        연승 랭킹
        <div class="tab-indicator"></div>
      </button>
      <button class="tab-btn" id="tab-winrate" onclick="switchTab('winrate')">
        적중률 랭킹
        <div class="tab-indicator"></div>
      </button>
    </div>

    <!-- Content -->
    <div class="scroll-area" id="scroll-area">
      <div id="streak-content"></div>
      <div id="winrate-content" style="display:none;"></div>
    </div>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script src="../src/js/utils/router.js"></script>
<script src="../src/js/components/bottom-nav.js"></script>
<script>
  renderBottomNav('ranking');

  const now = new Date();
  const quarter = Math.ceil((now.getMonth() + 1) / 3);
  const year = now.getFullYear();

  const STREAK_DATA = {
    my: { rank: 243, streak: 7, change: 12 },
    top3: [
      { rank: 1, name: '주식천재', streak: 89 },
      { rank: 2, name: '강남불개미', streak: 67 },
      { rank: 3, name: '코스피마스터', streak: 45 },
    ],
    list: [
      { rank: 4, name: '여의도고래', streak: 42 },
      { rank: 5, name: '스나이퍼', streak: 38 },
      { rank: 6, name: '단타의신', streak: 35 },
      { rank: 7, name: '존버가답이다', streak: 31 },
      { rank: 8, name: '수익률1000', streak: 29 },
      { rank: 9, name: '상한가요정', streak: 25 },
      { rank: 10, name: '워렌버핏동생', streak: 22 },
    ],
  };

  const WINRATE_DATA = {
    my: { rank: 87, winRate: 67.5, wins: 27, total: 40, change: -5 },
    top3: [
      { rank: 1, name: '예측마스터', winRate: 94.7, wins: 36, total: 38 },
      { rank: 2, name: '정확도왕', winRate: 91.3, wins: 42, total: 46 },
      { rank: 3, name: '프리딕터', winRate: 88.2, wins: 45, total: 51 },
    ],
    list: [
      { rank: 4, name: '코스피지킴이', winRate: 85.7, wins: 36, total: 42 },
      { rank: 5, name: '시장읽는남자', winRate: 83.3, wins: 40, total: 48 },
      { rank: 6, name: '차트분석가', winRate: 81.0, wins: 34, total: 42 },
      { rank: 7, name: '패턴추적자', winRate: 78.6, wins: 44, total: 56 },
      { rank: 8, name: '트렌드헌터', winRate: 76.5, wins: 39, total: 51 },
      { rank: 9, name: '수익률전문', winRate: 74.2, wins: 46, total: 62 },
      { rank: 10, name: '테크니컬러', winRate: 71.4, wins: 35, total: 49 },
    ],
  };

  const userIcon = (size=20, color='#94A3B8') => `
    <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>`;

  const crownIcon = `<svg width="24" height="24" viewBox="0 0 24 24" fill="#CA8A04" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>`;

  function changeHtml(change, type='streak') {
    if (change > 0) {
      return `<div class="rank-change" style="color:#00C896;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span class="rank-change-num">${change}</span>
      </div>`;
    } else {
      return `<div class="rank-change" style="color:#FF4D6A;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        <span class="rank-change-num">${Math.abs(change)}</span>
      </div>`;
    }
  }

  function renderStreakContent() {
    const d = STREAK_DATA;
    return `
      <div class="my-rank-bar">
        <div class="my-rank-left">
          <span style="font-size:15px;font-weight:700;color:var(--color-text-dark);">나</span>
          <div class="my-rank-dot"></div>
          <span class="my-rank-name">사용자닉네임</span>
          <div class="my-rank-dot"></div>
          <span class="my-rank-streak">${d.my.streak}연승</span>
        </div>
        <div class="my-rank-right">
          <span class="my-rank-position">${d.my.rank}등</span>
          ${changeHtml(d.my.change)}
        </div>
      </div>

      <div class="rank-1-row">
        <div class="rank-top-bg">
          <svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>
        </div>
        <div style="display:flex;align-items:center;gap:16px;position:relative;z-index:1;">
          <span style="font-family:var(--font-mono);font-size:28px;font-weight:900;width:32px;text-align:center;color:var(--color-primary);">1</span>
          <div class="rank-avatar" style="width:48px;height:48px;background:#FEF08A;border:2px solid #FDE047;box-shadow:0 1px 4px rgba(15,23,42,0.06);">${crownIcon}</div>
          <span style="font-size:18px;font-weight:700;color:var(--color-text-dark);">${d.top3[0].name}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px;position:relative;z-index:1;">
          <span style="font-family:var(--font-mono);font-size:36px;font-weight:900;color:var(--color-success);letter-spacing:-0.04em;line-height:1;">${d.top3[0].streak}</span>
          <span style="font-size:14px;font-weight:600;color:var(--color-text-dark);">연승</span>
        </div>
      </div>

      <div class="rank-row" style="background:var(--color-bg-subtle);">
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="rank-num" style="font-size:22px;font-weight:700;color:#64748B;">${d.top3[1].rank}</span>
          <div class="rank-avatar" style="width:40px;height:40px;background:var(--color-border);border:none;">${userIcon(20, '#64748B')}</div>
          <span style="font-size:16px;font-weight:700;color:var(--color-text-dark);">${d.top3[1].name}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px;">
          <span style="font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--color-text-dark);letter-spacing:-0.03em;">${d.top3[1].streak}</span>
          <span style="font-size:13px;font-weight:500;color:var(--color-text-mid);">연승</span>
        </div>
      </div>

      <div class="rank-row">
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="rank-num" style="font-size:20px;font-weight:700;color:var(--color-text-light);">${d.top3[2].rank}</span>
          <div class="rank-avatar" style="width:40px;height:40px;background:var(--color-bg-slate);border:none;">${userIcon(20, '#94A3B8')}</div>
          <span style="font-size:16px;font-weight:600;color:var(--color-text-dark);">${d.top3[2].name}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px;">
          <span style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--color-text-dark);letter-spacing:-0.03em;">${d.top3[2].streak}</span>
          <span style="font-size:13px;font-weight:500;color:var(--color-text-mid);">연승</span>
        </div>
      </div>

      ${d.list.map(u => `
        <div class="rank-row">
          <div style="display:flex;align-items:center;gap:16px;">
            <span class="rank-num" style="font-size:15px;color:var(--color-text-mid);">${u.rank}</span>
            <div class="rank-avatar" style="width:36px;height:36px;background:var(--color-bg-slate);border:none;">${userIcon(18, '#94A3B8')}</div>
            <span class="rank-user-name">${u.name}</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="display:flex;align-items:baseline;gap:2px;">
              <span class="rank-value">${u.streak}</span>
              <span class="rank-unit">연승</span>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      `).join('')}

      <div class="rank-row mine" style="background:var(--color-bg-subtle);">
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="rank-num" style="font-size:15px;color:var(--color-primary);font-weight:700;">${d.my.rank}</span>
          <div class="rank-avatar" style="width:36px;height:36px;background:var(--color-primary-light);border:none;">${userIcon(18, '#2563EB')}</div>
          <span style="font-size:15px;font-weight:700;color:var(--color-text-dark);">사용자닉네임</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="display:flex;align-items:baseline;gap:2px;">
            <span style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--color-primary);letter-spacing:-0.02em;">${d.my.streak}</span>
            <span class="rank-unit">연승</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <div class="update-note">
        <span class="note-badge">매일 15:35 업데이트</span>
      </div>
    `;
  }

  function renderWinrateContent() {
    const d = WINRATE_DATA;
    return `
      <div class="my-rank-bar">
        <div class="my-rank-left">
          <span style="font-size:15px;font-weight:700;color:var(--color-text-dark);">나</span>
          <div class="my-rank-dot"></div>
          <span class="my-rank-name">사용자닉네임</span>
          <div class="my-rank-dot"></div>
          <span class="my-rank-streak">${d.my.winRate}%</span>
        </div>
        <div class="my-rank-right">
          <span class="my-rank-position">${d.my.rank}등</span>
          ${changeHtml(d.my.change)}
        </div>
      </div>

      <div class="quarter-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span style="font-size:13px;font-weight:600;color:var(--color-text-dark);">${year}년 Q${quarter} 적중률 랭킹</span>
        <span style="font-size:12px;color:var(--color-text-mid);">(분기별 초기화)</span>
      </div>

      <div class="rank-1-row">
        <div class="rank-top-bg">
          <svg width="120" height="120" viewBox="0 0 24 24" fill="currentColor"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></svg>
        </div>
        <div style="display:flex;align-items:center;gap:16px;position:relative;z-index:1;">
          <span style="font-family:var(--font-mono);font-size:28px;font-weight:900;width:32px;text-align:center;color:var(--color-primary);">1</span>
          <div class="rank-avatar" style="width:48px;height:48px;background:#FEF08A;border:2px solid #FDE047;box-shadow:0 1px 4px rgba(15,23,42,0.06);">${crownIcon}</div>
          <div>
            <div style="font-size:18px;font-weight:700;color:var(--color-text-dark);">${d.top3[0].name}</div>
            <div style="font-size:11px;color:var(--color-text-mid);font-family:var(--font-mono);">${d.top3[0].wins}승 / ${d.top3[0].total}전</div>
          </div>
        </div>
        <div style="display:flex;align-items:baseline;gap:4px;position:relative;z-index:1;">
          <span style="font-family:var(--font-mono);font-size:36px;font-weight:900;color:var(--color-success);letter-spacing:-0.04em;line-height:1;">${d.top3[0].winRate}</span>
          <span style="font-size:14px;font-weight:600;color:var(--color-text-dark);">%</span>
        </div>
      </div>

      ${[d.top3[1], d.top3[2]].map((u, i) => `
        <div class="rank-row" style="background:${i===0?'var(--color-bg-subtle)':'white'};">
          <div style="display:flex;align-items:center;gap:16px;">
            <span class="rank-num" style="font-size:${i===0?22:20}px;font-weight:700;color:${i===0?'#64748B':'var(--color-text-light)'};">${u.rank}</span>
            <div class="rank-avatar" style="width:40px;height:40px;background:${i===0?'var(--color-border)':'var(--color-bg-slate)'};border:none;">${userIcon(20, i===0?'#64748B':'#94A3B8')}</div>
            <div>
              <div style="font-size:16px;font-weight:${i===0?7:6}00;color:var(--color-text-dark);">${u.name}</div>
              <div style="font-size:11px;color:var(--color-text-mid);font-family:var(--font-mono);">${u.wins}승 / ${u.total}전</div>
            </div>
          </div>
          <div style="display:flex;align-items:baseline;gap:4px;">
            <span style="font-family:var(--font-mono);font-size:${i===0?28:24}px;font-weight:700;color:var(--color-text-dark);letter-spacing:-0.03em;">${u.winRate}</span>
            <span style="font-size:13px;font-weight:500;color:var(--color-text-mid);">%</span>
          </div>
        </div>
      `).join('')}

      ${d.list.map(u => `
        <div class="rank-row">
          <div style="display:flex;align-items:center;gap:16px;">
            <span class="rank-num" style="font-size:15px;color:var(--color-text-mid);">${u.rank}</span>
            <div class="rank-avatar" style="width:36px;height:36px;background:var(--color-bg-slate);border:none;">${userIcon(18, '#94A3B8')}</div>
            <div>
              <span class="rank-user-name">${u.name}</span>
              <div style="font-size:11px;color:var(--color-text-light);font-family:var(--font-mono);">${u.wins}승 / ${u.total}전</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="display:flex;align-items:baseline;gap:2px;">
              <span class="rank-value">${u.winRate}</span>
              <span class="rank-unit">%</span>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
      `).join('')}

      <div class="rank-row mine">
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="rank-num" style="font-size:15px;color:var(--color-primary);font-weight:700;">${d.my.rank}</span>
          <div class="rank-avatar" style="width:36px;height:36px;background:var(--color-primary-light);border:none;">${userIcon(18, '#2563EB')}</div>
          <div>
            <div style="font-size:15px;font-weight:700;color:var(--color-text-dark);">사용자닉네임</div>
            <div style="font-size:11px;color:var(--color-text-mid);font-family:var(--font-mono);">${d.my.wins}승 / ${d.my.total}전</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="display:flex;align-items:baseline;gap:2px;">
            <span style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--color-primary);letter-spacing:-0.02em;">${d.my.winRate}</span>
            <span class="rank-unit">%</span>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <div class="update-note">
        <span class="note-badge">매일 15:35 업데이트</span>
        <span style="font-size:12px;color:var(--color-text-light);">다음 분기 ${year}년 Q${quarter + 1}에 초기화됩니다</span>
      </div>
    `;
  }

  function switchTab(tab) {
    ['streak', 'winrate'].forEach(t => {
      document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      document.getElementById(`${t}-content`).style.display = t === tab ? 'block' : 'none';
    });
  }

  // Initialize
  document.getElementById('streak-content').innerHTML = renderStreakContent();
  document.getElementById('winrate-content').innerHTML = renderWinrateContent();
</script>
</body>
</html>
