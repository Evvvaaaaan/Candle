<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/toggle.css">
  <link rel="stylesheet" href="../src/css/components/modal.css">
  <style>
    .settings-header {
      height: 56px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    .back-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--color-text-dark); cursor: pointer; }
    .back-btn:hover { background: var(--color-bg-subtle); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 20px 20px 8px;
    }

    .settings-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      margin: 0 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      height: 58px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-row:hover { background: var(--color-bg-subtle); }

    .setting-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--color-border);
      background: var(--color-bg-subtle);
      flex-shrink: 0;
    }
    .setting-icon.danger { background: var(--color-danger-bg); }

    .setting-info { flex: 1; min-width: 0; }
    .setting-name { font-size: 14px; font-weight: 500; color: var(--color-text-dark); line-height: 1.3; }
    .setting-name.danger { color: var(--color-danger-alt); }
    .setting-sub { font-size: 12px; color: var(--color-text-light); margin-top: 2px; }

    /* Profile card inside settings */
    .profile-banner {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      margin: 0 16px;
    }

    .profile-row { padding: 20px; display: flex; align-items: center; gap: 14px; }
    .profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--color-primary-light); border: 2px solid var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .progress-wrap { padding: 0 20px 18px; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-text { font-size: 12px; color: var(--color-text-mid); }
    .progress-num { font-size: 12px; font-weight: 700; color: var(--color-primary); font-family: var(--font-mono); }
    .progress-bg { height: 6px; background: var(--color-bg-subtle); border-radius: 9999px; overflow: hidden; border: 1px solid var(--color-border); }
    .progress-fill { height: 100%; background: var(--color-primary); border-radius: 9999px; }

    .edit-btn { font-size: 13px; color: var(--color-primary); background: var(--color-primary-light); padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:var(--color-bg-subtle);">

    <div class="settings-header">
      <button class="back-btn" id="back-btn" onclick="handleBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="flex:1;font-size:17px;font-weight:700;color:var(--color-text-dark);" id="screen-title">설정</div>
      <div id="header-right"></div>
    </div>

    <div class="scroll-area" id="screen-content" style="padding-bottom:40px;"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal" style="display:none;">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button class="btn btn-danger" id="modal-confirm" onclick="">확인</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../src/js/utils/router.js"></script>
<script>
  let currentScreen = 'main';

  function handleBack() {
    if (currentScreen === 'main') history.back();
    else showScreen('main');
  }

  function showModal(title, desc, confirmAction) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').textContent = desc;
    document.getElementById('modal-confirm').onclick = confirmAction;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function showScreen(screen) {
    currentScreen = screen;
    const title = { main:'설정', notification:'알림 설정', security:'보안 설정', reward:'리워드 수령 정보', account:'계정 정보' };
    document.getElementById('screen-title').textContent = title[screen] || '설정';

    const content = document.getElementById('screen-content');
    const headerRight = document.getElementById('header-right');
    headerRight.innerHTML = screen === 'main'
      ? `<div style="width:32px;height:32px;border-radius:50%;background:var(--color-primary-light);display:flex;align-items:center;justify-content:center;">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
         </div>` : '';

    if (screen === 'main') content.innerHTML = renderMain();
    else if (screen === 'notification') content.innerHTML = renderNotification();
    else if (screen === 'security') content.innerHTML = renderSecurity();
    else if (screen === 'reward') content.innerHTML = renderReward();
    else content.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;height:200px;color:var(--color-text-light);">준비 중</div>`;
  }

  function renderMain() {
    const streak = 7;
    return `
      <div class="section-label" style="padding-top:16px;">프로필</div>
      <div class="profile-banner">
        <div class="profile-row">
          <div class="profile-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-size:17px;font-weight:700;color:var(--color-text-dark);">주식고수123</div>
            <div style="font-size:12px;color:var(--color-text-light);margin-top:2px;">최고 연승 기록: 7일 · 2026.03.15 가입</div>
          </div>
          <button class="edit-btn">수정</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span class="progress-text">현재 연승 ${streak}일 · 10연승까지 ${10-streak}일</span>
            <span class="progress-num">${streak}/10</span>
          </div>
          <div class="progress-bg"><div class="progress-fill" style="width:${(streak/10)*100}%;"></div></div>
        </div>
      </div>

      <div class="section-label">계정</div>
      <div class="settings-card">
        ${settingRow('bell-blue', '알림 설정', '예측 오픈, 결과 공개, 마감 임박', "showScreen('notification')")}
        ${settingRow('lock', '보안 설정', '앱 잠금, 생체인증', "showScreen('security')")}
        ${settingRow('user', '계정 정보', 'ho***@kakao.com', "showScreen('account')")}
        ${settingRowRight('credit', '리워드 수령 정보', '국민은행 ****1234 ✓', '<span style="font-size:12px;color:var(--color-success);font-weight:600;">등록됨</span>', "showScreen('reward')")}
      </div>

      <div class="section-label">서비스</div>
      <div class="settings-card">
        ${settingRow('file', '이용약관', '', '')}
        ${settingRow('shield', '개인정보처리방침', '', '')}
        ${settingRow('help', '자주 묻는 질문', '', '')}
        ${settingRow('phone', '고객센터', '평일 10:00~18:00', '')}
        ${settingRowRight('megaphone', '공지사항', '', '<div style="width:8px;height:8px;border-radius:50%;background:var(--color-danger-alt);"></div>', '')}
        ${settingRow('star', '앱 평가하기', '앱스토어 리뷰 남기기', '')}
        ${settingRowRight('info', '버전 정보', '', '<div style="display:flex;align-items:center;gap:6px;"><span style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-light);">v1.0.0</span><span style="font-size:11px;color:var(--color-success);background:#F0FDF4;padding:2px 6px;border-radius:4px;font-weight:600;">최신</span></div>', '')}
      </div>

      <div class="section-label">계정 관리</div>
      <div class="settings-card">
        ${settingRow('logout', '로그아웃', '', "showModal('로그아웃 하시겠어요?','로그아웃 후에도 연승 기록은 유지됩니다.',()=>{closeModal();location.href='./login.html';})")}
        ${settingRowDanger('trash', '회원 탈퇴', '')}
      </div>

      <div style="text-align:center;padding:24px 0 40px;">
        <div style="font-size:11px;color:var(--color-text-light);">© 2026 Candle. All rights reserved.</div>
        <div style="font-size:11px;color:var(--color-border-mid);margin-top:4px;font-family:var(--font-mono);">v1.0.0 (Build 100)</div>
      </div>
    `;
  }

  function renderNotification() {
    return '<div style="padding:20px;color:var(--color-text-mid);font-size:14px;">알림 설정 화면은 <a href="./notification-settings.html" style="color:var(--color-primary);">알림설정 페이지</a>에서 확인하세요.</div>';
  }

  function renderSecurity() {
    return `
      <div class="section-label">잠금 설정</div>
      <div class="settings-card">
        <div class="setting-row" style="cursor:default;">
          ${iconSvg('lock')}
          <div class="setting-info">
            <div class="setting-name">앱 잠금</div>
            <div class="setting-sub">앱 실행 시 인증을 요구합니다</div>
          </div>
          <button class="toggle" id="app-lock" onclick="this.classList.toggle('on')"><div class="toggle__thumb"></div></button>
        </div>
        <div class="setting-row" style="cursor:default;opacity:0.4;">
          ${iconSvg('shield')}
          <div class="setting-info">
            <div class="setting-name">생체 인증</div>
            <div class="setting-sub">앱 잠금을 먼저 켜주세요</div>
          </div>
          <button class="toggle"><div class="toggle__thumb"></div></button>
        </div>
      </div>
      <div class="section-label">최근 로그인 기록</div>
      <div class="settings-card">
        ${['2026.05.08 09:12','2026.05.07 18:34','2026.05.06 21:05'].map((d,i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;${i<2?'border-bottom:1px solid var(--color-border);':''}">
            <span style="font-family:var(--font-mono);font-size:13px;color:var(--color-text-dark);">${d}</span>
            <span style="font-size:12px;color:var(--color-text-light);">서울, KR</span>
          </div>
        `).join('')}
        <div style="padding:10px 20px;background:var(--color-warning-bg);border-top:1px solid var(--color-border);">
          <span style="font-size:12px;color:var(--color-warning);">이상한 접속이 보이시나요? 즉시 로그아웃하세요.</span>
        </div>
      </div>
    `;
  }

  function renderReward() {
    return `
      <div style="padding:12px 16px 0;">
        <div style="background:white;border:1px solid var(--color-border);border-radius:12px;padding:14px 18px;border-left:3px solid var(--color-primary);">
          <div style="font-size:13px;font-weight:600;color:var(--color-text-dark);">10연승 달성 전에 미리 등록해두면 즉시 신청 가능해요</div>
          <div style="font-size:12px;color:var(--color-text-light);margin-top:4px;">달성 후 등록도 가능합니다</div>
        </div>
      </div>
      <div style="margin:16px 16px 0;display:flex;gap:8px;">
        <button onclick="setRewardTab('account')" id="tab-account" style="flex:1;height:42px;border-radius:10px;font-size:14px;font-weight:600;background:var(--color-primary);color:white;border:1.5px solid var(--color-primary);cursor:pointer;">계좌이체</button>
        <button onclick="setRewardTab('kakao')" id="tab-kakao" style="flex:1;height:42px;border-radius:10px;font-size:14px;font-weight:600;background:white;color:var(--color-text-mid);border:1.5px solid var(--color-border);cursor:pointer;">카카오페이</button>
      </div>
      <div style="padding:12px 16px;" id="reward-tab-content">
        <div style="background:white;border:1px solid var(--color-border);border-radius:12px;overflow:hidden;">
          <div style="display:flex;align-items:center;gap:12px;padding:16px 20px;">
            <div style="width:40px;height:40px;border-radius:10px;background:#F0FDF4;border:1px solid #22C55E;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div style="flex:1;">
              <div style="font-size:15px;font-weight:700;color:var(--color-text-dark);">국민은행 ****1234</div>
              <div style="font-size:13px;color:var(--color-text-light);margin-top:2px;">홍길동 · 등록 완료</div>
            </div>
            <button style="font-size:13px;color:var(--color-primary);background:var(--color-primary-light);padding:6px 12px;border-radius:8px;font-weight:600;cursor:pointer;">수정</button>
          </div>
        </div>
      </div>
      <div style="padding:0 16px;">
        <div style="background:white;border:1px solid var(--color-border);border-radius:12px;padding:16px 20px;">
          <div style="font-size:12px;font-weight:700;color:var(--color-text-mid);margin-bottom:10px;">💡 세금 안내</div>
          <div style="font-size:13px;color:var(--color-text-dark);margin-bottom:6px;">기타소득세 22% 원천징수 후 지급</div>
          <div style="font-size:20px;font-weight:900;color:var(--color-primary);font-family:var(--font-mono);margin-bottom:6px;">40만원 → 실수령 312,000원</div>
          <div style="font-size:12px;color:var(--color-text-light);">연간 84만원 초과 시 종합소득세 신고 대상</div>
        </div>
      </div>
    `;
  }

  function setRewardTab(tab) {
    document.getElementById('tab-account').style.background = tab === 'account' ? 'var(--color-primary)' : 'white';
    document.getElementById('tab-account').style.color = tab === 'account' ? 'white' : 'var(--color-text-mid)';
    document.getElementById('tab-account').style.borderColor = tab === 'account' ? 'var(--color-primary)' : 'var(--color-border)';
    document.getElementById('tab-kakao').style.background = tab === 'kakao' ? 'var(--color-primary)' : 'white';
    document.getElementById('tab-kakao').style.color = tab === 'kakao' ? 'white' : 'var(--color-text-mid)';
    document.getElementById('tab-kakao').style.borderColor = tab === 'kakao' ? 'var(--color-primary)' : 'var(--color-border)';
  }

  // Icon helpers
  const ICON_SVG = {
    'bell-blue': `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
    lock: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
    user: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    credit: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,
    file: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
    shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    help: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    phone: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.6 19.79 19.79 0 0 1 1.61 5 2 2 0 0 1 3.6 2.87h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.81-.81a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
    megaphone: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
    star: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
    info: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
    logout: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
    trash: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  };

  function iconSvg(key) {
    return `<div class="setting-icon">${ICON_SVG[key] || ''}</div>`;
  }

  function settingRow(icon, name, sub, onclick) {
    const chevron = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;
    return `<div class="setting-row" onclick="${onclick}">
      <div class="setting-icon">${ICON_SVG[icon] || ''}</div>
      <div class="setting-info">
        <div class="setting-name">${name}</div>
        ${sub ? `<div class="setting-sub">${sub}</div>` : ''}
      </div>
      ${onclick ? chevron : ''}
    </div>`;
  }

  function settingRowRight(icon, name, sub, rightHtml, onclick) {
    return `<div class="setting-row" onclick="${onclick}">
      <div class="setting-icon">${ICON_SVG[icon] || ''}</div>
      <div class="setting-info">
        <div class="setting-name">${name}</div>
        ${sub ? `<div class="setting-sub">${sub}</div>` : ''}
      </div>
      ${rightHtml}
    </div>`;
  }

  function settingRowDanger(icon, name, sub) {
    return `<div class="setting-row" onclick="showModal('정말 탈퇴하시겠어요?','탈퇴 시 현재 7일 연승 기록과 모든 예측 기록이 영구 삭제됩니다.',()=>{closeModal();location.href='./login.html';})">
      <div class="setting-icon danger">${ICON_SVG[icon] || ''}</div>
      <div class="setting-info">
        <div class="setting-name danger">${name}</div>
        ${sub ? `<div class="setting-sub">${sub}</div>` : ''}
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`;
  }

  showScreen('main');
</script>
</body>
</html>
