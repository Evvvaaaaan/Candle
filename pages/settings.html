<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/toggle.css">
  <link rel="stylesheet" href="../src/css/components/modal.css">
  <style>
    .settings-header {
      height: 56px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    .back-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--color-text-dark); cursor: pointer; }
    .back-btn:hover { background: var(--color-bg-subtle); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-light);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 20px 20px 8px;
    }

    .settings-card {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      margin: 0 16px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      height: 58px;
      background: white;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-row:hover { background: var(--color-bg-subtle); }

    .setting-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--color-border);
      background: var(--color-bg-subtle);
      flex-shrink: 0;
    }
    .setting-icon.danger { background: var(--color-danger-bg); }

    .setting-info { flex: 1; min-width: 0; }
    .setting-name { font-size: 14px; font-weight: 500; color: var(--color-text-dark); line-height: 1.3; }
    .setting-name.danger { color: var(--color-danger-alt); }
    .setting-sub { font-size: 12px; color: var(--color-text-light); margin-top: 2px; }

    /* Profile card inside settings */
    .profile-banner {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      margin: 0 16px;
    }

    .profile-row { padding: 20px; display: flex; align-items: center; gap: 14px; }
    .profile-avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--color-primary-light); border: 2px solid var(--color-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .progress-wrap { padding: 0 20px 18px; }
    .progress-meta { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .progress-text { font-size: 12px; color: var(--color-text-mid); }
    .progress-num { font-size: 12px; font-weight: 700; color: var(--color-primary); font-family: var(--font-mono); }
    .progress-bg { height: 6px; background: var(--color-bg-subtle); border-radius: 9999px; overflow: hidden; border: 1px solid var(--color-border); }
    .progress-fill { height: 100%; background: var(--color-primary); border-radius: 9999px; }

    .edit-btn { font-size: 13px; color: var(--color-primary); background: var(--color-primary-light); padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; }

    /* ── 잠금 화면 ─────────────────────────────── */
    .lock-screen {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 32px 40px;
    }
    .lock-screen.hidden { display: none; }

    .lock-icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: var(--color-primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .lock-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--color-text-dark);
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      font-size: 14px;
      color: var(--color-text-mid);
      margin-bottom: 40px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── PIN 입력 공통 ─────────────────────────── */
    .pin-dots {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--color-border-mid);
      background: transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .pin-dot.filled {
      background: var(--color-primary);
      border-color: var(--color-primary);
      transform: scale(1.1);
    }
    .pin-dot.error {
      background: var(--color-danger);
      border-color: var(--color-danger);
      animation: pinShake 0.35s ease;
    }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    .pin-error-msg {
      font-size: 13px;
      color: var(--color-danger);
      font-weight: 600;
      height: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── 숫자 패드 ─────────────────────────────── */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 12px;
    }
    .numpad-key {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      font-size: 22px;
      font-weight: 600;
      color: var(--color-text-dark);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .numpad-key:active { background: var(--color-border); transform: scale(0.94); }
    .numpad-key.key-empty { background: transparent; border-color: transparent; cursor: default; }
    .numpad-key.key-delete { background: transparent; border-color: transparent; }
    .numpad-key.key-delete:active { background: var(--color-bg-subtle); }

    .bio-btn {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 14px;
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-primary);
      cursor: pointer;
      transition: background 0.15s;
    }
    .bio-btn:active { background: var(--color-border); }

    /* ── PIN 설정 모달 ─────────────────────────── */
    .pin-modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 60;
    }
    .pin-modal-overlay.hidden { display: none; }

    .pin-modal-sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 20px 24px 40px;
      box-shadow: 0 -4px 24px rgba(15,23,42,0.12);
      animation: slideUp 0.25s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pin-modal-handle {
      width: 36px;
      height: 4px;
      background: var(--color-border-mid);
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .pin-modal-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin-bottom: 4px;
    }
    .pin-modal-sub {
      font-size: 13px;
      color: var(--color-text-light);
      margin-bottom: 28px;
    }

    /* ── 보안 화면 전용 ────────────────────────── */
    .security-status-banner {
      margin: 12px 16px 0;
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .security-status-banner.on {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
    }
    .security-status-banner.off {
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      color: var(--color-text-mid);
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:var(--color-bg-subtle);">

    <div class="settings-header">
      <button class="back-btn" id="back-btn" onclick="handleBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="flex:1;font-size:17px;font-weight:700;color:var(--color-text-dark);" id="screen-title">설정</div>
      <div id="header-right"></div>
    </div>

    <!-- 잠금 화면 -->
    <div class="lock-screen hidden" id="lock-screen">
      <div class="lock-icon-wrap">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="lock-title">Candle</div>
      <div class="lock-subtitle" id="lock-subtitle">PIN을 입력하세요</div>
      <div class="pin-dots" id="lock-dots">
        <div class="pin-dot" id="lock-dot-0"></div>
        <div class="pin-dot" id="lock-dot-1"></div>
        <div class="pin-dot" id="lock-dot-2"></div>
        <div class="pin-dot" id="lock-dot-3"></div>
        <div class="pin-dot" id="lock-dot-4"></div>
        <div class="pin-dot" id="lock-dot-5"></div>
      </div>
      <div class="pin-error-msg" id="lock-error"></div>
      <div class="numpad" id="lock-numpad"></div>
      <button class="bio-btn hidden" id="lock-bio-btn" onclick="LockScreen.triggerBiometric()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12c0-1.7.7-3.3 1.8-4.5"/><path d="M17.5 21C17 20 16 18 16 15c0-1.7-.7-3.3-1.8-4.5"/><path d="M22 12c0 3-1 6-3 8.5"/><path d="M12 2a8 8 0 0 1 8 8c0 4.3-1.7 8-4.7 10.5"/><path d="M12 2a8 8 0 0 0-8 8c0 2 .5 3.9 1.3 5.5"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M12 6a6 6 0 0 0-6 6c0 1.5.4 3 1 4.2"/><path d="M12 10a2 2 0 0 1 2 2c0 1.4-.6 2.7-1.5 3.6"/><path d="M12 10a2 2 0 0 0-2 2c0 .8.2 1.5.5 2.2"/></svg>
        생체 인증 사용
      </button>
    </div>

    <div class="scroll-area" id="screen-content" style="padding-bottom:40px;"></div>

    <!-- 일반 확인 모달 -->
    <div class="modal-overlay" id="modal" style="display:none;">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">취소</button>
          <button class="btn btn-danger" id="modal-confirm" onclick="">확인</button>
        </div>
      </div>
    </div>

    <!-- PIN 설정 모달 -->
    <div class="pin-modal-overlay hidden" id="pin-modal">
      <div class="pin-modal-sheet">
        <div class="pin-modal-handle"></div>
        <div class="pin-modal-title" id="pin-modal-title">PIN 설정</div>
        <div class="pin-modal-sub" id="pin-modal-sub">6자리 PIN을 입력하세요</div>
        <div class="pin-dots">
          <div class="pin-dot" id="pin-dot-0"></div>
          <div class="pin-dot" id="pin-dot-1"></div>
          <div class="pin-dot" id="pin-dot-2"></div>
          <div class="pin-dot" id="pin-dot-3"></div>
          <div class="pin-dot" id="pin-dot-4"></div>
          <div class="pin-dot" id="pin-dot-5"></div>
        </div>
        <div class="pin-error-msg" id="pin-error"></div>
        <div class="numpad" id="pin-numpad"></div>
        <button onclick="PinModal.cancel()" style="margin-top:20px;font-size:14px;color:var(--color-text-light);font-weight:500;cursor:pointer;padding:8px 16px;border-radius:8px;" id="pin-cancel-btn">취소</button>
      </div>
    </div>

  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script src="../src/js/utils/router.js"></script>
<script>
  let currentScreen = 'main';

  function handleBack() {
    if (currentScreen === 'main') history.back();
    else showScreen('main');
  }

  function showModal(title, desc, confirmAction) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-desc').textContent = desc;
    document.getElementById('modal-confirm').onclick = confirmAction;
    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function showScreen(screen) {
    currentScreen = screen;
    const title = { main:'설정', notification:'알림 설정', security:'보안 설정', reward:'리워드 수령 정보', account:'계정 정보' };
    document.getElementById('screen-title').textContent = title[screen] || '설정';

    const content = document.getElementById('screen-content');
    const headerRight = document.getElementById('header-right');
    headerRight.innerHTML = screen === 'main'
      ? `<div style="width:32px;height:32px;border-radius:50%;background:var(--color-primary-light);display:flex;align-items:center;justify-content:center;">
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
         </div>` : '';

    if (screen === 'main') content.innerHTML = renderMain();
    else if (screen === 'notification') content.innerHTML = renderNotification();
    else if (screen === 'security') {
      content.innerHTML = renderSecurity();
    }
    else if (screen === 'reward') content.innerHTML = renderReward();
    else content.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;height:200px;color:var(--color-text-light);">준비 중</div>`;
  }

  function renderMain() {
    const streak = 7;
    return `
      <div class="section-label" style="padding-top:16px;">프로필</div>
      <div class="profile-banner">
        <div class="profile-row">
          <div class="profile-avatar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div style="flex:1;">
            <div style="font-size:17px;font-weight:700;color:var(--color-text-dark);">주식고수123</div>
            <div style="font-size:12px;color:var(--color-text-light);margin-top:2px;">최고 연승 기록: 7일 · 2026.03.15 가입</div>
          </div>
          <button class="edit-btn">수정</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span class="progress-text">현재 연승 ${streak}일 · 10연승까지 ${10-streak}일</span>
            <span class="progress-num">${streak}/10</span>
          </div>
          <div class="progress-bg"><div class="progress-fill" style="width:${(streak/10)*100}%;"></div></div>
        </div>
      </div>

      <div class="section-label">계정</div>
      <div class="settings-card">
        ${settingRow('bell-blue', '알림 설정', '예측 오픈, 결과 공개, 마감 임박', "showScreen('notification')")}
        ${settingRow('lock', '보안 설정', '앱 잠금, 생체인증', "showScreen('security')")}
        ${settingRow('user', '계정 정보', 'ho***@kakao.com', "showScreen('account')")}
        ${settingRowRight('credit', '리워드 수령 정보', '국민은행 ****1234 ✓', '<span style="font-size:12px;color:var(--color-success);font-weight:600;">등록됨</span>', "showScreen('reward')")}
      </div>

      <div class="section-label">서비스</div>
      <div class="settings-card">
        ${settingRow('file', '이용약관', '', "location.href='./terms.html'")}
        ${settingRow('shield', '개인정보처리방침', '', "location.href='./privacy.html'")}
        ${settingRow('help', '자주 묻는 질문', '', "location.href='./faq.html'")}
        ${settingRow('phone', '고객센터', '평일 10:00~18:00', '')}
        ${settingRowRight('megaphone', '공지사항', '', '<div style="width:8px;height:8px;border-radius:50%;background:var(--color-danger-alt);"></div>', '')}
        ${settingRow('star', '앱 평가하기', '앱스토어 리뷰 남기기', '')}
        ${settingRowRight('info', '버전 정보', '', '<div style="display:flex;align-items:center;gap:6px;"><span style="font-family:var(--font-mono);font-size:12px;color:var(--color-text-light);">v1.0.0</span><span style="font-size:11px;color:var(--color-success);background:#F0FDF4;padding:2px 6px;border-radius:4px;font-weight:600;">최신</span></div>', '')}
      </div>

      <div class="section-label">계정 관리</div>
      <div class="settings-card">
        ${settingRow('logout', '로그아웃', '', "showModal('로그아웃 하시겠어요?','로그아웃 후에도 연승 기록은 유지됩니다.',()=>{closeModal();location.href='./login.html';})")}
        ${settingRowDanger('trash', '회원 탈퇴', '')}
      </div>

      <div style="text-align:center;padding:24px 0 40px;">
        <div style="font-size:11px;color:var(--color-text-light);">© 2026 Candle. All rights reserved.</div>
        <div style="font-size:11px;color:var(--color-border-mid);margin-top:4px;font-family:var(--font-mono);">v1.0.0 (Build 100)</div>
      </div>
    `;
  }

  function renderNotification() {
    return '<div style="padding:20px;color:var(--color-text-mid);font-size:14px;">알림 설정 화면은 <a href="./notification-settings.html" style="color:var(--color-primary);">알림설정 페이지</a>에서 확인하세요.</div>';
  }

  function renderSecurity() {
    const locked   = Security.isAppLockEnabled();
    const biometric = Security.isBiometricEnabled();

    return `
      <div class="security-status-banner ${locked ? 'on' : 'off'}">
        ${locked
          ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>잠금이 설정되어 있습니다`
          : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>잠금이 해제되어 있습니다`}
      </div>

      <div class="section-label">잠금 설정</div>
      <div class="settings-card">
        <div class="setting-row" style="cursor:default;">
          ${iconSvg('lock')}
          <div class="setting-info">
            <div class="setting-name">앱 잠금</div>
            <div class="setting-sub">앱 이탈 후 복귀 시 PIN 인증 요구</div>
          </div>
          <button class="toggle ${locked ? 'on' : ''}" id="toggle-app-lock" onclick="Security.toggleAppLock()">
            <div class="toggle__thumb"></div>
          </button>
        </div>
        <div class="setting-row" style="cursor:default; ${!locked ? 'opacity:0.38;pointer-events:none;' : ''}">
          ${iconSvg('fingerprint')}
          <div class="setting-info">
            <div class="setting-name">생체 인증</div>
            <div class="setting-sub">${
              !locked         ? '앱 잠금을 먼저 켜주세요' :
              biometric       ? 'Face ID / 지문 — 등록됨' :
              biometricAvailable ? 'Face ID 또는 지문으로 잠금 해제' :
                                   '이 기기는 생체 인증을 지원하지 않습니다'
            }</div>
          </div>
          <button class="toggle ${biometric ? 'on-green' : ''}" id="toggle-biometric"
                  onclick="Security.toggleBiometric()"
                  ${!locked || !biometricAvailable ? 'disabled' : ''}>
            <div class="toggle__thumb"></div>
          </button>
        </div>
      </div>

  // ────────────────────────────────────────────
  // Security: 상태 관리 + WebAuthn
  // ────────────────────────────────────────────
  let biometricAvailable = false;

  const Security = {
    K: {
      LOCK_ON:  'security_app_lock',
      BIO_ON:   'security_biometric',
      PIN_HASH: 'security_pin_hash',
      CRED_ID:  'security_credential_id',
      HIDDEN_AT:'security_hidden_at',
    },

    isAppLockEnabled: () => Storage.get('security_app_lock') === true,
    isBiometricEnabled: () => Storage.get('security_biometric') === true,

    async hashPin(pin) {
      const buf = await crypto.subtle.digest('SHA-256',
        new TextEncoder().encode(pin + ':candle_pin_salt'));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    },

    async setPin(pin) {
      Storage.set(Security.K.PIN_HASH, await Security.hashPin(pin));
    },

    async verifyPin(pin) {
      const stored = Storage.get(Security.K.PIN_HASH);
      if (!stored) return false;
      return stored === await Security.hashPin(pin);
    },

    // 앱 잠금 토글 진입점
    toggleAppLock() {
      if (Security.isAppLockEnabled()) {
        // 비활성화: 현재 PIN 확인 후 해제
        PinModal.open('disable-lock');
      } else {
        // 활성화: 새 PIN 설정
        PinModal.open('setup-new');
      }
    },

    enableAppLock() {
      Storage.set(Security.K.LOCK_ON, true);
    },

    disableAppLock() {
      Storage.set(Security.K.LOCK_ON, false);
      Storage.set(Security.K.BIO_ON, false);
      Storage.remove(Security.K.PIN_HASH);
      Storage.remove(Security.K.CRED_ID);
    },

    // 생체 인증 토글 진입점
    async toggleBiometric() {
      if (Security.isBiometricEnabled()) {
        Storage.set(Security.K.BIO_ON, false);
        Storage.remove(Security.K.CRED_ID);
        showScreen('security');
      } else {
        try {
          const credId = await Security.registerBiometric();
          Storage.set(Security.K.BIO_ON, true);
          Storage.set(Security.K.CRED_ID, credId);
          showScreen('security');
        } catch (e) {
          if (e.name !== 'NotAllowedError') {
            alert('생체 인증 등록에 실패했습니다.\n기기 설정에서 Face ID 또는 지문을 먼저 등록해 주세요.');
          }
        }
      }
    },

    async registerBiometric() {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const rpId = location.hostname || 'localhost';
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge,
          rp: { name: 'Candle', id: rpId },
          user: {
            id: new TextEncoder().encode('candle-user-' + Date.now()),
            name: 'candle-user',
            displayName: 'Candle 사용자',
          },
          pubKeyCredParams: [
            { alg: -7,   type: 'public-key' },  // ES256
            { alg: -257, type: 'public-key' },  // RS256
          ],
          authenticatorSelection: {
            authenticatorAttachment: 'platform',
            requireResidentKey: false,
            userVerification: 'required',
          },
          timeout: 60000,
        }
      });
      // rawId를 base64로 직렬화해 localStorage에 보관
      return btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
    },

    async verifyBiometric() {
      const stored = Storage.get(Security.K.CRED_ID);
      if (!stored) throw new Error('no credential');
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      const credIdBytes = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
      await navigator.credentials.get({
        publicKey: {
          challenge,
          allowCredentials: [{ id: credIdBytes, type: 'public-key' }],
          userVerification: 'required',
          timeout: 60000,
        }
      });
    },
  };

  // ────────────────────────────────────────────
  // PIN 입력 패드 공통 렌더러
  // ────────────────────────────────────────────
  function renderNumpad(containerId, onDigit, onDelete) {
    const pad = document.getElementById(containerId);
    if (!pad) return;
    const keys = [1,2,3,4,5,6,7,8,9,'','0','⌫'];
    pad.innerHTML = keys.map(k => {
      if (k === '')  return `<button class="numpad-key key-empty" disabled></button>`;
      if (k === '⌫') return `<button class="numpad-key key-delete" onclick="${onDelete}">`
        + `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>`;
      return `<button class="numpad-key" onclick="${onDigit}(${k})">${k}</button>`;
    }).join('');
  }

  function updateDots(prefix, count, error) {
    for (let i = 0; i < 6; i++) {
      const dot = document.getElementById(`${prefix}-dot-${i}`);
      if (!dot) continue;
      dot.className = 'pin-dot' + (error ? ' error' : i < count ? ' filled' : '');
    }
  }

  // ────────────────────────────────────────────
  // PinModal: PIN 설정 모달 컨트롤러
  // ────────────────────────────────────────────
  const PinModal = (() => {
    // mode: 'setup-new' | 'change' | 'disable-lock'
    let mode = 'setup-new';
    // step: 'enter' | 'confirm' | 'verify-old' | 'enter-new' | 'confirm-new'
    let step = 'enter';
    let input = '';
    let firstPin = '';

    const TITLES = {
      'enter':       ['PIN 설정',   '사용할 6자리 PIN을 입력하세요'],
      'confirm':     ['PIN 확인',   'PIN을 다시 입력해 주세요'],
      'verify-old':  ['PIN 확인',   '현재 PIN을 입력하세요'],
      'enter-new':   ['새 PIN 설정','새로운 6자리 PIN을 입력하세요'],
      'confirm-new': ['새 PIN 확인','새 PIN을 다시 입력해 주세요'],
      'unlock':      ['잠금 해제',  '현재 PIN을 입력하세요'],
    };

    function show() {
      document.getElementById('pin-modal').classList.remove('hidden');
    }
    function hide() {
      document.getElementById('pin-modal').classList.add('hidden');
      input = ''; firstPin = '';
    }
    function setUI() {
      const [title, sub] = TITLES[step] || ['PIN','PIN을 입력하세요'];
      document.getElementById('pin-modal-title').textContent = title;
      document.getElementById('pin-modal-sub').textContent = sub;
      document.getElementById('pin-error').textContent = '';
      updateDots('pin', 0, false);
      input = '';
    }

    async function onDigit(d) {
      if (input.length >= 6) return;
      input += d;
      updateDots('pin', input.length, false);
      if (input.length < 6) return;

      // 6자리 완성 → 처리
      await handleComplete();
    }

    function onDelete() {
      if (!input.length) return;
      input = input.slice(0, -1);
      updateDots('pin', input.length, false);
    }

    async function handleComplete() {
      if (step === 'enter') {
        firstPin = input; step = 'confirm'; setUI();

      } else if (step === 'confirm') {
        if (input === firstPin) {
          await Security.setPin(input);
          Security.enableAppLock();
          hide();
          showScreen('security');
        } else {
          showError('PIN이 일치하지 않습니다. 처음부터 다시 입력하세요.');
          step = 'enter'; setUI();
        }

      } else if (step === 'verify-old') {
        if (await Security.verifyPin(input)) {
          if (mode === 'disable-lock') {
            Security.disableAppLock();
            hide();
            showScreen('security');
          } else {
            step = 'enter-new'; setUI();
          }
        } else {
          showError('PIN이 맞지 않습니다.');
        }

      } else if (step === 'enter-new') {
        firstPin = input; step = 'confirm-new'; setUI();

      } else if (step === 'confirm-new') {
        if (input === firstPin) {
          await Security.setPin(input);
          hide();
          showScreen('security');
        } else {
          showError('PIN이 일치하지 않습니다.');
          step = 'enter-new'; setUI();
        }
      }
    }

    function showError(msg) {
      updateDots('pin', 6, true);
      document.getElementById('pin-error').textContent = msg;
      setTimeout(() => { updateDots('pin', 0, false); input = ''; }, 900);
    }

    return {
      open(m) {
        mode = m;
        step = (m === 'setup-new')     ? 'enter'      :
               (m === 'disable-lock')  ? 'verify-old' :
               (m === 'change')        ? 'verify-old' : 'enter';
        setUI();
        renderNumpad('pin-numpad', 'PinModal.digit', 'PinModal.delete()');
        document.getElementById('pin-cancel-btn').style.display =
          (m === 'disable-lock' || m === 'change') ? 'block' : 'none';
        show();
      },
      cancel() {
        // 잠금 해제 중 취소는 불가 — 설정 모달에서만 취소 허용
        hide();
      },
      digit(d) { onDigit(String(d)); },
      delete()  { onDelete(); },
    };
  })();

  // ────────────────────────────────────────────
  // LockScreen: 잠금 화면 컨트롤러
  // ────────────────────────────────────────────
  const LockScreen = (() => {
    let input = '';

    function show() {
      const el = document.getElementById('lock-screen');
      el.classList.remove('hidden');
      // 생체 인증 버튼 표시 여부
      const bioBtn = document.getElementById('lock-bio-btn');
      if (Security.isBiometricEnabled() && biometricAvailable) {
        bioBtn.classList.remove('hidden');
      } else {
        bioBtn.classList.add('hidden');
      }
      updateDots('lock', 0, false);
      document.getElementById('lock-error').textContent = '';
      input = '';
    }

    function hide() {
      document.getElementById('lock-screen').classList.add('hidden');
      input = '';
    }

    async function onDigit(d) {
      if (input.length >= 6) return;
      input += d;
      updateDots('lock', input.length, false);
      if (input.length < 6) return;

      if (await Security.verifyPin(input)) {
        hide();
      } else {
        updateDots('lock', 6, true);
        document.getElementById('lock-error').textContent = 'PIN이 맞지 않습니다';
        setTimeout(() => {
          updateDots('lock', 0, false);
          document.getElementById('lock-error').textContent = '';
          input = '';
        }, 900);
      }
    }

    function onDelete() {
      if (!input.length) return;
      input = input.slice(0, -1);
      updateDots('lock', input.length, false);
    }

    return {
      show,
      hide,
      digit(d) { onDigit(String(d)); },
      delete()  { onDelete(); },
      async triggerBiometric() {
        try {
          await Security.verifyBiometric();
          hide();
        } catch (e) {
          if (e.name !== 'NotAllowedError') {
            document.getElementById('lock-error').textContent = '생체 인증에 실패했습니다. PIN을 입력하세요.';
          }
        }
      },
    };
  })();

  // ────────────────────────────────────────────
  // 앱 포커스 복귀 시 잠금 트리거
  // ────────────────────────────────────────────
  const LOCK_AFTER_MS = 30_000; // 30초 이상 자리 비움 시 잠금

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      Storage.set(Security.K.HIDDEN_AT, Date.now());
    } else {
      if (!Security.isAppLockEnabled()) return;
      const hiddenAt = Storage.get(Security.K.HIDDEN_AT);
      if (hiddenAt && Date.now() - hiddenAt > LOCK_AFTER_MS) {
        LockScreen.show();
        if (Security.isBiometricEnabled() && biometricAvailable) {
          LockScreen.triggerBiometric();
        }
      }
    }
  });

  // ────────────────────────────────────────────
  // 초기화
  // ────────────────────────────────────────────
  async function init() {
    // 생체 인증 지원 여부 비동기 확인
    if (window.isSecureContext && window.PublicKeyCredential) {
      try {
        biometricAvailable = await PublicKeyCredential
          .isUserVerifyingPlatformAuthenticatorAvailable();
      } catch { biometricAvailable = false; }
    }

    // 잠금 상태 확인 (페이지 로드 시 숨겨진 채 돌아온 경우)
    if (Security.isAppLockEnabled()) {
      const hiddenAt = Storage.get(Security.K.HIDDEN_AT);
      if (hiddenAt && Date.now() - hiddenAt > LOCK_AFTER_MS) {
        renderNumpad('lock-numpad', 'LockScreen.digit', 'LockScreen.delete()');
        LockScreen.show();
        if (Security.isBiometricEnabled() && biometricAvailable) {
          LockScreen.triggerBiometric();
        }
      }
    }

    showScreen('main');
  }

  init();
</script>
</body>
</html>
