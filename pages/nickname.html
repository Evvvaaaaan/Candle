<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 닉네임 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/button.css">
  <style>
    .nickname-content {
      flex: 1;
      padding: 16px 24px 0;
      display: flex;
      flex-direction: column;
    }

    .nickname-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--color-text-dark);
      margin-bottom: 40px;
    }

    .nickname-avatar {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
    }

    .avatar-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }

    .input-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 4px;
      margin-bottom: 4px;
    }

    .input-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text-mid);
    }

    .input-count {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--color-text-light);
    }

    .nickname-input {
      width: 100%;
      height: 56px;
      background: var(--color-bg-subtle);
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 400;
      color: var(--color-text-dark);
      transition: border-color 0.2s;
      box-shadow: 0 1px 4px rgba(15,23,42,0.04);
    }

    .nickname-input::placeholder { color: var(--color-text-light); }
    .nickname-input:focus { border-color: var(--color-primary); }
    .nickname-input.valid { border-color: var(--color-success); }
    .nickname-input.invalid { border-color: var(--color-danger-alt); }

    .validation-msg {
      height: 24px;
      padding: 0 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .validation-msg.valid { color: var(--color-success); }
    .validation-msg.invalid { color: var(--color-danger-alt); }
    .validation-msg.idle { color: var(--color-text-mid); }

    .nickname-footer {
      padding: 24px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .nickname-note {
      font-size: 12px;
      color: var(--color-text-mid);
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen">

    <header class="page-header" style="border-bottom:none;">
      <button class="header-back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </header>

    <div class="nickname-content">
      <h1 class="nickname-title">닉네임을 설정해주세요</h1>

      <div class="nickname-avatar">
        <div class="avatar-circle">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <div class="input-wrap">
        <div class="input-label-row">
          <span class="input-label">닉네임</span>
          <span class="input-count"><span id="char-count">0</span><span style="color:#CBD5E1">/10</span></span>
        </div>
        <input type="text" id="nickname-input" class="nickname-input" maxlength="10" placeholder="주식고수123" autocomplete="off">
        <div class="validation-msg idle" id="validation-msg">
          <span>한글, 영문, 숫자 조합 가능</span>
        </div>
      </div>
    </div>

    <div class="nickname-footer">
      <span class="nickname-note">닉네임은 랭킹에 공개됩니다</span>
      <button class="btn btn-full" id="start-btn" style="height:56px;font-size:16px;" disabled>
        시작하기
      </button>
    </div>

  </div>
</div>

<script src="../src/js/utils/storage.js"></script>
<script>
  const input = document.getElementById('nickname-input');
  const msg = document.getElementById('validation-msg');
  const btn = document.getElementById('start-btn');
  const counter = document.getElementById('char-count');

  let status = 'idle';

  input.addEventListener('input', () => {
    const val = input.value;
    counter.textContent = val.length;

    if (val.length === 0) {
      setStatus('idle', '한글, 영문, 숫자 조합 가능');
      return;
    }

    const isDuplicate = val.includes('중복') || val.toLowerCase() === 'admin';
    if (isDuplicate) {
      setStatus('invalid', '이미 사용 중인 닉네임이에요');
    } else if (val.length >= 2) {
      setStatus('valid', '사용 가능한 닉네임이에요');
    } else {
      setStatus('idle', '2자 이상 입력해주세요');
    }
  });

  function setStatus(s, text) {
    status = s;
    input.className = 'nickname-input' + (s !== 'idle' ? ` ${s}` : '');
    msg.className = `validation-msg ${s}`;

    const icon = s === 'valid'
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
      : s === 'invalid'
      ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      : '';

    msg.innerHTML = `${icon}<span>${text}</span>`;
    btn.disabled = s !== 'valid';
    btn.className = s === 'valid' ? 'btn btn-primary btn-full' : 'btn btn-full';
    btn.style.height = '56px';
    btn.style.fontSize = '16px';
  }

  btn.addEventListener('click', () => {
    if (status !== 'valid') return;
    Storage.set('user_nickname', input.value);
    location.href = './home.html';
  });
</script>
</body>
</html>
