<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Candle - 알림 설정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../src/css/base/reset.css">
  <link rel="stylesheet" href="../src/css/base/variables.css">
  <link rel="stylesheet" href="../src/css/components/layout.css">
  <link rel="stylesheet" href="../src/css/components/header.css">
  <link rel="stylesheet" href="../src/css/components/toggle.css">
  <style>
    .preview-box {
      margin: 0;
      padding: 20px;
      background: var(--color-bg-subtle);
      border-bottom: 1px solid var(--color-border);
    }

    .preview-label { font-size: 12px; font-weight: 500; color: var(--color-text-mid); margin-bottom: 12px; display: block; }

    .preview-card {
      background: var(--color-bg-subtle);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(15,23,42,0.04);
      border: 1px solid var(--color-border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .preview-icon {
      width: 36px; height: 36px;
      background: var(--color-primary);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .preview-content { flex: 1; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .preview-app { font-size: 12px; font-weight: 600; color: var(--color-text-mid); }
    .preview-time { font-size: 11px; color: var(--color-text-light); font-family: var(--font-mono); }
    .preview-title { font-size: 14px; font-weight: 600; color: var(--color-text-dark); margin-bottom: 4px; }
    .preview-body { font-size: 13px; color: var(--color-text-mid); line-height: 1.5; }

    .settings-list { padding: 16px 20px; display: flex; flex-direction: column; gap: 24px; margin-top: 8px; }

    .setting-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .setting-item-left { display: flex; gap: 12px; flex: 1; }
    .setting-icon-wrap { width: 32px; height: 32px; border-radius: 50%; background: var(--color-bg-subtle); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }

    .setting-title { font-size: 16px; font-weight: 600; color: var(--color-text-dark); margin-bottom: 4px; }
    .setting-desc { font-size: 13px; color: var(--color-text-mid); }

    .time-select-wrap {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s;
    }
    .time-select-wrap.open { max-height: 100px; }

    .time-select-inner {
      display: flex; align-items: center; gap: 12px;
      background: var(--color-bg-subtle);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      margin-top: 12px;
      margin-left: 44px;
    }

    .time-label { font-size: 13px; color: var(--color-text-mid); font-weight: 500; }

    .time-select {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-primary);
      background: var(--color-primary-light);
      padding: 6px 10px 6px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .divider-h { height: 1px; background: var(--color-border); }

    .bottom-actions { padding: 32px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

    .btn-all-off {
      width: 100%; height: 52px;
      border-radius: 12px;
      border: 1px solid var(--color-danger-alt);
      color: var(--color-danger-alt);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-all-off:hover { background: #FEF2F2; }

    .device-note { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-mid); }
  </style>
</head>
<body>
<div class="app-wrapper">
  <div class="screen" style="background:white;">

    <header class="page-header" style="position:sticky;top:0;">
      <button class="header-back-btn" onclick="history.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h1 class="header-title">알림 설정</h1>
      <div style="width:40px;"></div>
    </header>

    <div class="scroll-area">
      <!-- Preview -->
      <div class="preview-box">
        <span class="preview-label">알림 미리보기</span>
        <div class="preview-card">
          <div class="preview-icon">
            <svg width="24" height="24" viewBox="0 0 60 60" fill="none">
              <rect x="26" y="16" width="8" height="28" rx="2" fill="white"/>
              <line x1="30" y1="8" x2="30" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <line x1="30" y1="44" x2="30" y2="52" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <rect x="12" y="28" width="8" height="16" rx="2" fill="white" opacity="0.6"/>
              <rect x="40" y="20" width="8" height="20" rx="2" fill="white" opacity="0.8"/>
            </svg>
          </div>
          <div class="preview-content">
            <div class="preview-header">
              <span class="preview-app">Candle</span>
              <span class="preview-time">지금</span>
            </div>
            <div class="preview-title">🔥 오늘 예측 마감까지 1시간 남았어요!</div>
            <div class="preview-body">7연승을 지키세요. 지금 바로 참여하여 리워드에 도전하세요.</div>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="settings-list" id="settings-list">
        <!-- Items rendered by JS -->
      </div>

      <!-- Bottom -->
      <div class="bottom-actions">
        <button class="btn-all-off" onclick="turnOffAll()">모든 알림 끄기</button>
        <div class="device-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          알림을 받으려면 기기 설정에서 허용해주세요
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const SETTINGS = {
    open:    { label: '예측 오픈 알림',  desc: '매일 저녁 6시에 오늘의 예측이 열립니다', icon: 'bell', on: true, hasTime: true },
    close:   { label: '예측 마감 알림',  desc: '마감 1시간 전에 알려드려요', icon: 'alert', on: true },
    result:  { label: '결과 공개 알림',  desc: '장 마감 후 결과가 나오면 알려드려요', icon: 'chart', on: true },
    streak:  { label: '연승 위험 알림',  desc: '오늘 예측을 안 하면 연승이 끊깁니다', icon: 'flame', on: true },
    ranking: { label: '랭킹 변동 알림',  desc: '내 랭킹이 변동되면 알려드려요', icon: 'trophy', on: false },
  };

  const icons = {
    bell:   `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
    alert:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    chart:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
    flame:  `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
    trophy: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`,
  };

  function createToggle(key, on) {
    return `<button class="toggle ${on ? 'on-green' : ''}" id="toggle-${key}" onclick="toggleSetting('${key}')">
      <div class="toggle__thumb"></div>
    </button>`;
  }

  function render() {
    const list = document.getElementById('settings-list');
    const keys = Object.keys(SETTINGS);
    list.innerHTML = keys.map((key, i) => {
      const s = SETTINGS[key];
      return `
        ${i > 0 ? '<div class="divider-h"></div>' : ''}
        <div class="setting-item">
          <div class="setting-item-left">
            <div class="setting-icon-wrap">${icons[s.icon]}</div>
            <div>
              <div class="setting-title">${s.label}</div>
              <div class="setting-desc">${s.desc}</div>
              ${s.hasTime ? `
                <div class="time-select-wrap ${s.on ? 'open' : ''}" id="time-wrap-${key}">
                  <div class="time-select-inner">
                    <span class="time-label">알림 시간</span>
                    <select class="time-select">
                      <option>18:00</option><option>19:00</option><option>20:00</option>
                    </select>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
          ${createToggle(key, s.on)}
        </div>
      `;
    }).join('');
  }

  function toggleSetting(key) {
    SETTINGS[key].on = !SETTINGS[key].on;
    const toggle = document.getElementById(`toggle-${key}`);
    toggle.classList.toggle('on-green', SETTINGS[key].on);
    const timeWrap = document.getElementById(`time-wrap-${key}`);
    if (timeWrap) timeWrap.classList.toggle('open', SETTINGS[key].on);
  }

  function turnOffAll() {
    Object.keys(SETTINGS).forEach(k => { SETTINGS[k].on = false; });
    render();
  }

  render();
</script>
</body>
</html>
