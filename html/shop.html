<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 포인트 상점</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section class="screen-view" data-screen="shop" id="shop" aria-label="포인트 상점">
            <div class="status-bar" aria-hidden="true"></div>
            <header class="app-header">
              <div class="brand">
                <img src="images/candle-logo.png" alt="" /><span>Candle</span>
              </div>
              <a
                class="header-account"
                data-route="profile"
                aria-label="내 정보"
                href="profile.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4.5 21v-1a7.5 7.5 0 0 1 15 0v1" />
                </svg>
              </a>
            </header>
            <div class="content">
              <h1 class="heading" tabindex="-1">포인트 상점</h1>
              <p class="subheading">보유 포인트로 교환을 신청하세요.</p>
              <section class="card points-card">
                <div class="points-copy">
                  <p class="card-label">보유 포인트</p>
                  <p class="number" data-server-value="balance">—</p>
                </div>
                <button class="link-button" type="button" data-wallet-tab="use">내역 보기 ›</button>
              </section>
              <div class="section-heading">
                <h2 class="section-title">네이버페이 포인트로 교환</h2>
                <span>1P = 1원</span>
              </div>
              <div class="card product-list">
                <button
                  class="product-card"
                  type="button"
                  aria-pressed="true"
                  data-product="naverpay-5000"
                  data-product-amount="5000"
                  data-product-points="5000"
                  data-product-title="네이버페이 5,000원권"
                >
                  <span class="product-radio" aria-hidden="true"></span
                  ><span class="product-copy"
                    ><strong>5,000원</strong><small>5,000P 차감</small></span
                  ></button
                ><button
                  class="product-card"
                  type="button"
                  aria-pressed="false"
                  data-product="naverpay-10000"
                  data-product-amount="10000"
                  data-product-points="10000"
                  data-product-title="네이버페이 10,000원권"
                >
                  <span class="product-radio" aria-hidden="true"></span
                  ><span class="product-copy"
                    ><strong>10,000원</strong><small>10,000P 차감</small></span
                  ></button
                ><button
                  class="product-card"
                  type="button"
                  disabled
                  data-product="naverpay-30000"
                  data-product-amount="30000"
                  data-product-points="30000"
                  data-product-title="네이버페이 30,000원권"
                >
                  <span class="product-radio" aria-hidden="true"></span
                  ><span class="product-copy"
                    ><strong>30,000원</strong><small>30,000P 차감</small></span
                  ><span class="product-state">17,550P 부족</span></button
                ><button
                  class="product-card"
                  type="button"
                  disabled
                  data-product="naverpay-50000"
                  data-product-amount="50000"
                  data-product-points="50000"
                  data-product-title="네이버페이 50,000원권"
                >
                  <span class="product-radio" aria-hidden="true"></span
                  ><span class="product-copy"
                    ><strong>50,000원</strong><small>50,000P 차감</small></span
                  ><span class="product-state">37,550P 부족</span></button
                ><button
                  class="product-card"
                  type="button"
                  disabled
                  data-product="naverpay-100000"
                  data-product-amount="100000"
                  data-product-points="100000"
                  data-product-title="네이버페이 100,000원권"
                >
                  <span class="product-radio" aria-hidden="true"></span
                  ><span class="product-copy"
                    ><strong>100,000원</strong><small>100,000P 차감</small></span
                  ><span class="product-state">87,550P 부족</span>
                </button>
              </div>
              <a class="primary-button product-submit" data-route="exchange" href="exchange.html">
                5,000원 교환하기
              </a>
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a class="nav-item" data-route="stock-select" href="stock-select.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item active" data-route="shop" aria-current="page" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/account.js"></script>
  </body>
</html>
