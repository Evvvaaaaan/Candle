<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 시작</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view splash-screen"
            data-screen="splash"
            id="splash"
            aria-label="시작"
          >
            <div class="splash-lockup">
              <img src="images/candle-logo.png" alt="Candle 로고" />
              <h1>Candle</h1>
              <p>오늘의 선택이 내일의 포인트로</p>
            </div>
            <a class="launch-note" data-route="signup" href="signup.html"
              >시장 예측 리워드 서비스</a
            >
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // 스플래시는 2초 뒤 자동으로 넘어갑니다. 세션이 있으면 홈, 없으면 시작 화면입니다.
      setTimeout(() => {
        const hasSession = !isMissingToken(localStorage.getItem('refreshToken'));
        location.replace(hasSession ? 'home.html' : 'signup.html');
      }, 2000);
    </script>
  </body>
</html>
