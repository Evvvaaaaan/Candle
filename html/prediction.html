<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 예측</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section class="screen-view" data-screen="prediction" id="prediction" aria-label="예측">
            <div class="status-bar" aria-hidden="true"></div>
            <header class="transaction-header">
              <a class="back-button" data-route="home" aria-label="이전 화면" href="home.html">
                <img src="images/chevron-left.svg" alt="" />
              </a>
              <h1 tabindex="-1">예측</h1>
            </header>
            <div class="content">
              <section class="card stock-card">
                <div class="stock-heading-row">
                  <h1 class="heading" tabindex="-1" data-stock-name-value="">삼성전자</h1>
                  <button
                    class="watchlist-toggle"
                    type="button"
                    data-watchlist-toggle=""
                    aria-pressed="false"
                    aria-label="관심종목에 추가"
                  >
                    <svg
                      class="ui-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path d="M6 4h12v17l-6-4-6 4V4Z"></path>
                    </svg>
                  </button>
                </div>
                <p class="subheading"><span data-stock-meta-value="">005930 · 코스피</span></p>
                <div class="quote-row"><span>조회 가격</span><span>71,200원 +1.28%</span></div>
              </section>
              <a class="ticket-card" data-route="pass" href="pass.html">
                <span class="row-between"
                  ><span>사용 가능한 예측권</span
                  ><strong class="ticket-total" data-server-value="tickets">—</strong></span
                ><span class="ticket-breakdown"
                  ><span>기본 무료 <strong>1회</strong></span
                  ><span>광고 예측권 <strong>2장</strong></span></span
                >
              </a>
              <p class="prediction-question">다음 거래일 종가를 예측해 보세요</p>
              <div class="direction-grid">
                <button
                  class="direction-card selected"
                  type="button"
                  data-direction="up"
                  aria-pressed="true"
                >
                  <span class="direction-icon"><img src="images/arrow-up.svg" alt="" /></span
                  ><span
                    ><span class="direction-title">상승</span
                    ><span class="direction-caption">오를 것 같아요</span></span
                  ></button
                ><button
                  class="direction-card"
                  type="button"
                  data-direction="down"
                  aria-pressed="false"
                >
                  <span class="direction-icon down"><img src="images/arrow-down.svg" alt="" /></span
                  ><span
                    ><span class="direction-title">하락</span
                    ><span class="direction-caption">내릴 것 같아요</span></span
                  >
                </button>
              </div>
              <button
                class="primary-button"
                type="button"
                data-prediction-review=""
                aria-haspopup="dialog"
                aria-controls="prediction-review-dialog"
              >
                예측 확인
              </button>
              <p class="ticket-policy">
                예측권은 제출할 때 사용되며, 접수 후에는 변경할 수 없어요.<br />시세를 확인하려면
                실제 서버 연결이 필요합니다.
              </p>
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a
                class="nav-item active"
                data-route="stock-select"
                aria-current="page"
                href="stock-select.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item" data-route="shop" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
          <dialog
            id="prediction-review-dialog"
            class="reward-ad-dialog"
            aria-labelledby="prediction-review-title"
            aria-describedby="prediction-review-note"
          >
            <div class="sheet-handle" aria-hidden="true"></div>
            <h2 id="prediction-review-title">선택한 예측 확인</h2>
            <div class="summary-card prediction-review-summary">
              <div class="summary-row">
                <span>종목</span><strong data-stock-name-value="">삼성전자</strong>
              </div>
              <div class="summary-row">
                <span>종목 정보</span><strong data-stock-meta-value="">005930 · 코스피</strong>
              </div>
              <div class="summary-row"><span>조회 가격</span><strong>71,200원</strong></div>
              <div class="summary-row">
                <span>예측 방향</span><strong class="up-text" data-direction-value="">상승</strong>
              </div>
            </div>
            <p id="prediction-review-note" class="reward-ad-note">
              예측권 사용 가능 여부는 서버 연결 후 확인할 수 있어요.<br />접수 후에는 변경할 수
              없어요.
            </p>
            <button id="submit-prediction" class="primary-button" type="button" autofocus>
              예측 제출
            </button>
            <button id="cancel-prediction-review" class="reward-ad-cancel" type="button">
              취소
            </button>
          </dialog>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/prediction.js"></script>
  </body>
</html>
