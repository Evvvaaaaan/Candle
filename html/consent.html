<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 가입 전 확인</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view consent-screen"
            data-screen="consent"
            id="consent"
            aria-label="가입 전 확인"
          >
            <div class="status-bar" aria-hidden="true"></div>
            <header class="consent-header">
              <a
                class="consent-close"
                data-route="signup"
                aria-label="약관 동의 닫기"
                href="signup.html"
              >
                <span aria-hidden="true">×</span>
              </a>
            </header>
            <div class="consent-main">
              <div class="consent-intro">
                <img src="images/candle-logo.png" width="76" height="76" alt="Candle" />
                <h1 tabindex="-1">고객님,<br />환영합니다!</h1>
              </div>
              <div class="consent-agreements" aria-label="가입 약관 동의">
                <div class="agree-all">
                  <label class="check-row"
                    ><input id="agree-all" type="checkbox" /><strong>약관 전체동의</strong></label
                  >
                </div>
                <div class="agreement-card">
                  <div class="agreement-line">
                    <label class="check-row"
                      ><input
                        id="age"
                        class="agreement-checkbox required-agreement"
                        type="checkbox"
                        data-agreement="age"
                      /><span>만 14세 이상입니다 (필수)</span></label
                    ><a
                      data-legal="age"
                      aria-label="만 14세 이상입니다 내용 보기"
                      href="legal-age.html"
                    >
                      <svg
                        class="ui-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="m9 5 7 7-7 7"></path>
                      </svg>
                    </a>
                  </div>
                  <div class="agreement-line">
                    <label class="check-row"
                      ><input
                        id="terms"
                        class="agreement-checkbox required-agreement"
                        type="checkbox"
                        data-agreement="terms"
                      /><span>서비스 이용약관 동의 (필수)</span></label
                    ><a
                      data-legal="terms"
                      aria-label="서비스 이용약관 동의 내용 보기"
                      href="legal-terms.html"
                    >
                      <svg
                        class="ui-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="m9 5 7 7-7 7"></path>
                      </svg>
                    </a>
                  </div>
                  <div class="agreement-line">
                    <label class="check-row"
                      ><input
                        id="privacy"
                        class="agreement-checkbox required-agreement"
                        type="checkbox"
                        data-agreement="privacy"
                      /><span>개인정보 처리방침 동의 (필수)</span></label
                    ><a
                      data-legal="privacy"
                      aria-label="개인정보 처리방침 동의 내용 보기"
                      href="legal-privacy.html"
                    >
                      <svg
                        class="ui-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path d="m9 5 7 7-7 7"></path>
                      </svg>
                    </a>
                  </div>
                </div>
              </div>
            </div>
            <button
              id="consent-submit"
              class="primary-button consent-action"
              type="button"
              disabled=""
            >
              다음
            </button>
          </section>

          <dialog id="legal-dialog" class="reward-ad-dialog" aria-labelledby="legal-dialog-title">
            <h2 id="legal-dialog-title">서비스 이용약관 동의</h2>
            <div class="legal-copy">승인된 약관 본문을 확인하려면 실제 서버 연결이 필요합니다.</div>
            <button class="secondary-button" type="button" data-close-dialog="legal-dialog">
              닫기
            </button>
          </dialog>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/forms.js"></script>
  </body>
</html>
