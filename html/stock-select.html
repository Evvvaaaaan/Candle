<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 종목 선택</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view stock-select-screen"
            data-screen="stock-select"
            id="stock-select"
            aria-label="종목 선택"
          >
            <div class="status-bar" aria-hidden="true"></div>
            <header class="app-header">
              <div class="brand">
                <img src="images/candle-logo.png" alt="" /><span>Candle</span>
              </div>
              <a
                class="header-account"
                data-route="profile"
                aria-label="내 정보"
                href="profile.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4.5 21v-1a7.5 7.5 0 0 1 15 0v1" />
                </svg>
              </a>
            </header>
            <div class="stock-select-content">
              <h1 class="heading" tabindex="-1">어떤 종목을 예측할까요?</h1>
              <p class="subheading">종목을 고르면 다음 거래일 방향을 예측할 수 있어요.</p>
              <label class="stock-search"
                ><span aria-hidden="true">⌕</span
                ><input
                  id="stock-search-input"
                  type="search"
                  aria-label="종목명 또는 종목코드 검색"
                  placeholder="종목명 또는 종목코드 검색"
                  value=""
              /></label>
              <div class="stock-market-tabs" role="group" aria-label="시장 구분">
                <button type="button" data-market="all" aria-pressed="true" class="active">
                  전체</button
                ><button type="button" data-market="코스피" aria-pressed="false" class="">
                  코스피</button
                ><button type="button" data-market="코스닥" aria-pressed="false" class="">
                  코스닥</button
                ><button type="button" data-market="watchlist" aria-pressed="false" class="">
                  관심종목
                </button>
              </div>
              <div class="stock-list-heading">
                <h2 id="stock-list-title">국내 종목</h2>
                <span id="stock-result-count">20개</span>
              </div>
              <div id="stock-select-list" class="card stock-select-list"></div>
              <p id="stock-empty" class="stock-empty" hidden="">검색 결과가 없습니다.</p>
              <p id="stock-top-note" class="stock-data-note">
                시가총액 상위 20개 종목을 보여드리고 있어요.<br />원하는 종목이 없다면 검색해보세요!
              </p>
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a
                class="nav-item active"
                data-route="stock-select"
                aria-current="page"
                href="stock-select.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item" data-route="shop" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/stocks.js"></script>
  </body>
</html>
