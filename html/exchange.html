<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 교환 확인</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section class="screen-view" data-screen="exchange" id="exchange" aria-label="교환 확인">
            <div class="status-bar" aria-hidden="true"></div>
            <header class="transaction-header">
              <a class="back-button" data-route="shop" aria-label="이전 화면" href="shop.html">
                <img src="images/chevron-left.svg" alt="" />
              </a>
              <h1 tabindex="-1">교환 확인</h1>
            </header>
            <div class="content">
              <div class="product-card compact">
                <img
                  class="npay-logo"
                  src="images/npay-symbol.svg"
                  width="56"
                  height="56"
                  alt="네이버페이"
                /><span class="product-copy"
                  ><strong data-product-amount-value="">5,000원권</strong
                  ><small>네이버페이</small></span
                ><span class="product-state" data-product-points-value="">5,000P</span>
              </div>
              <section class="summary-card">
                <div class="summary-row">
                  <span>보유 포인트</span><strong data-server-value="balance">—</strong>
                </div>
                <div class="summary-row">
                  <span>교환 가능 여부</span><strong>서버 연결 필요</strong>
                </div>
              </section>
              <p class="field-help">
                교환 가능 여부와 지급 안내는 서버 연결 후 확인할 수 있습니다.
              </p>
              <a class="primary-button" data-route="payout" href="payout.html">수령 정보 입력</a>
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a class="nav-item" data-route="stock-select" href="stock-select.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item active" data-route="shop" aria-current="page" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/account.js"></script>
  </body>
</html>
