<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 약관 보기</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view legal-screen"
            data-screen="legal"
            id="legal"
            aria-label="약관 보기"
          >
            <div class="status-bar" aria-hidden="true"></div>
            <header class="transaction-header">
              <a
                class="back-button"
                data-route="settings"
                aria-label="이전 화면"
                href="settings.html"
              >
                <img src="images/chevron-left.svg" alt="" />
              </a>
              <h1 tabindex="-1">서비스 이용약관 동의</h1>
            </header>
            <div class="consent-main">
              <p class="field-help">서버 연결 필요</p>
              <div class="legal-copy">
                승인된 약관 본문을 확인하려면 실제 서버 연결이 필요합니다.
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
