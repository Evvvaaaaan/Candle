<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 로그인</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view signup-screen"
            data-screen="signup"
            id="signup"
            aria-label="로그인"
          >
            <div class="status-bar" aria-hidden="true"></div>
            <div class="signup-content">
              <div class="signup-brand">
                <img src="images/candle-logo.png" alt="" /><span>Candle</span>
              </div>
              <div class="signup-intro">
                <h1 tabindex="-1">로그인</h1>
                <p>오늘의 시장을 예측하고<br />포인트를 모아보세요.</p>
              </div>
              <div class="signup-auth">
                <h2 class="auth-label">간편 로그인</h2>
                <div class="auth-list">
                  <button class="auth-button kakao" type="button" data-login="kakao">
                    <img src="images/kakao.svg" alt="" />카카오로 계속하기</button
                  ><button class="auth-button naver" type="button" data-login="naver">
                    <img src="images/naver.svg" alt="" />네이버로 계속하기</button
                  ><button class="auth-button google" type="button" data-login="google">
                    <img src="images/google.svg" alt="" />Google로 계속하기</button
                  ><button class="auth-button apple" type="button" data-login="apple">
                    <img src="images/apple.png" alt="" />Apple로 계속하기
                  </button>
                </div>
              </div>
            </div>
            <details class="card temp-login">
              <summary>개발용 임시 로그인</summary>
              <form id="temp-login-form">
                <div class="form-field">
                  <label for="input_username">ID</label
                  ><input
                    disabled
                    data-requires-js
                    id="input_username"
                    name="username"
                    autocomplete="username"
                    required
                  />
                </div>
                <div class="form-field">
                  <label for="input_password">Password</label
                  ><input
                    disabled
                    data-requires-js
                    id="input_password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                  />
                </div>
                <button id="temp-login-submit" class="primary-button" type="submit">
                  임시로그인
                </button>
              </form>
            </details>
            <p class="signup-note">처음 이용하는 경우 다음 단계에서 필수 약관을 확인합니다.</p>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
