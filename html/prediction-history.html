<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 예측 내역</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section
            class="screen-view"
            data-screen="prediction-history"
            id="prediction-history"
            aria-label="예측 내역"
          >
            <div class="status-bar" aria-hidden="true"></div>
            <header class="transaction-header">
              <a
                class="back-button"
                data-route="profile"
                aria-label="이전 화면"
                href="profile.html"
              >
                <img src="images/chevron-left.svg" alt="" />
              </a>
              <h1 tabindex="-1">예측 내역</h1>
            </header>
            <div class="content">
              <p class="field-help">
                현재 내역은 디자인 미리보기입니다. 내역 조회 API는 아직 연결되지 않았습니다.
              </p>
              <section class="card result-card">
                <span class="icon-tile"
                  ><svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 2"></path></svg
                ></span>
                <div class="result-copy">
                  <strong class="result-stock">삼성전자</strong>
                  <p class="result-meta"><strong>↗ 상승</strong> · 결과 확정 후 확인</p>
                </div>
                <span class="badge pending">결과 대기</span>
              </section>
              <section class="card result-card">
                <span class="icon-tile complete"
                  ><svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m5 12 4 4L19 6"></path></svg
                ></span>
                <div class="result-copy">
                  <strong class="result-stock">SK하이닉스</strong>
                  <p class="result-meta">
                    <strong>↘ 하락</strong> · 15P · <span class="result-hit">적중</span>
                  </p>
                </div>
                <button class="primary-button" type="button" data-claim="history-won">
                  15P 받기
                </button>
              </section>
              <section class="card result-card">
                <span class="icon-tile complete"
                  ><svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="m5 12 4 4L19 6"></path></svg
                ></span>
                <div class="result-copy">
                  <strong class="result-stock">NAVER</strong>
                  <p class="result-meta">
                    <strong>↗ 상승</strong> · 15P · <span class="result-hit">적중</span>
                  </p>
                </div>
                <button class="primary-button" type="button" data-claim="history-claimed" disabled>
                  수령 완료
                </button>
              </section>
              <section class="card result-card">
                <span class="icon-tile miss"
                  ><svg
                    class="ui-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M12 5v9m0 5h.01"></path></svg
                ></span>
                <div class="result-copy">
                  <strong class="result-stock">카카오</strong>
                  <p class="result-meta">
                    <strong>↘ 하락</strong> · 5P · <span class="result-miss">미적중</span>
                  </p>
                </div>
                <button class="primary-button" type="button" data-claim="history-lost">
                  5P 받기
                </button>
              </section>
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a
                class="nav-item active"
                data-route="stock-select"
                aria-current="page"
                href="stock-select.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item" data-route="shop" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
