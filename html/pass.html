<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Candle · 예측권</title>
    <link rel="icon" href="images/candle-logo.png" type="image/png" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/static.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="device-stage" aria-label="Candle 서비스">
        <div class="phone" id="app">
          <section class="screen-view" data-screen="pass" id="pass" aria-label="예측권">
            <div class="status-bar" aria-hidden="true"></div>
            <header class="transaction-header">
              <a class="back-button" data-route="home" aria-label="이전 화면" href="home.html">
                <img src="images/chevron-left.svg" alt="" />
              </a>
            </header>
            <div class="content">
              <h1 class="heading" tabindex="-1">추가 예측권</h1>
              <p class="subheading">영상 광고의 완료가 확인되면 예측권을 받을 수 있습니다.</p>
              <section class="ticket-card">
                <span class="row-between"
                  ><span>사용 가능한 예측권</span
                  ><strong class="ticket-total" data-server-value="tickets">—</strong></span
                ><span class="ticket-breakdown"
                  ><span>기본 무료 <strong>1회</strong></span
                  ><span>광고 예측권 <strong>2장</strong></span></span
                >
              </section>
              <section class="card promo-card">
                <div class="row-between">
                  <h2>광고 보고 예측권 받기</h2>
                  <span class="ad-count">오늘 2 / 10회</span>
                </div>
                <p>광고 시청을 끝까지 완료하면 예측권이 지급됩니다.</p>
                <div class="progress-track"><div class="progress-fill"></div></div>
                <button class="primary-button" type="button" data-reward-ad="">광고 보기</button>
              </section>
              <a class="secondary-button" data-route="stock-select" href="stock-select.html"
                >예측하러 가기</a
              >
            </div>
            <nav class="bottom-nav" aria-label="하단 메뉴">
              <a class="nav-item" data-route="home" href="home.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z" /></svg
                ><span>홈</span></a
              ><a
                class="nav-item active"
                data-route="stock-select"
                aria-current="page"
                href="stock-select.html"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M5 20v-4m7 4v-6m7 6v-8" />
                  <path d="m3 11 5-4 4 3 8-7" />
                  <path d="M15 3h5v5" /></svg
                ><span>예측</span></a
              ><a class="nav-item" data-route="missions" href="missions.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <rect x="4" y="5" width="16" height="16" rx="4" />
                  <path d="M8 3v4m8-4v4M8 14l3 3 5-6" /></svg
                ><span>미션</span></a
              ><a class="nav-item" data-route="shop" href="shop.html">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M4 9h16l-1 12H5L4 9Z" />
                  <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
                ><span>상점</span>
              </a>
            </nav>
          </section>
          <dialog
            id="reward-ad-dialog"
            class="reward-ad-dialog"
            aria-labelledby="reward-ad-title"
            aria-describedby="reward-ad-description"
          >
            <div class="sheet-handle" aria-hidden="true"></div>
            <span class="icon-tile reward-ad-icon"
              ><svg
                class="ui-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="3" y="8" width="18" height="4" rx="1" />
                <path d="M5 12v9h14v-9M12 8v13" />
                <path d="M12 8H8a3 3 0 1 1 3-3l1 3Zm0 0h4a3 3 0 1 0-3-3l-1 3Z" /></svg
            ></span>
            <h2 id="reward-ad-title">광고 보고 예측권 받기</h2>
            <p id="reward-ad-description">
              영상 광고를 끝까지 시청하면<br />예측권 1장을 받을 수 있어요.
            </p>
            <div class="reward-ad-allowance">
              <span>오늘 남은 참여</span><strong>8<span> / 10회</span></strong>
            </div>
            <p class="reward-ad-note">
              광고를 본 뒤 이 화면으로 돌아오면 완료 여부를 확인해요.<br />예측은 자동으로 제출되지
              않아요.
            </p>
            <button id="start-reward-ad" class="primary-button" type="button" autofocus>
              광고 시청하기
            </button>
            <button id="cancel-reward-ad" class="reward-ad-cancel" type="button">
              나중에 할게요
            </button>
          </dialog>
        </div>
      </section>
    </main>
    <script src="js/backend-config.js"></script>
    <script src="default/jquery.js"></script>
    <script src="default/flutter.js"></script>
    <script src="default/custom.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/account.js"></script>
  </body>
</html>
