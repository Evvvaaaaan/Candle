name: candle
description: 주식 예측 챌린지 앱 - 내 예측이 곧 수익이 되는 공간
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.3.0

  # Network
  dio: ^5.7.0

  # Dependency injection
  get_it: ^8.0.3

  # Functional error handling
  dartz: ^0.10.1

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Lightweight local storage
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
